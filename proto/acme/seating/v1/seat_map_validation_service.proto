syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatMapValidationServiceProto";
option java_package = "com.acme.seating.v1";

// Checks seat maps against the rules before anything acts on them.
service SeatMapValidationService {
  // Validates a seat map.
  rpc ValidateSeatMap(ValidateSeatMapRequest) returns (ValidateSeatMapResponse);

  // Previews a seat map.
  rpc PreviewSeatMap(PreviewSeatMapRequest) returns (PreviewSeatMapResponse);

  // Checks a seat map.
  rpc CheckSeatMapEligibility(CheckSeatMapEligibilityRequest) returns (CheckSeatMapEligibilityResponse);

  // Normalizes a seat map.
  rpc NormalizeSeatMap(NormalizeSeatMapRequest) returns (NormalizeSeatMapResponse);

  // Explains a seat map.
  rpc ExplainSeatMapDecision(ExplainSeatMapDecisionRequest) returns (ExplainSeatMapDecisionResponse);

  // Scores a seat map.
  rpc ScoreSeatMap(ScoreSeatMapRequest) returns (ScoreSeatMapResponse);

  // Lints a seat map.
  rpc LintSeatMaps(LintSeatMapsRequest) returns (LintSeatMapsResponse);

  // Returns a seat map.
  rpc GetSeatMapRules(GetSeatMapRulesRequest) returns (GetSeatMapRulesResponse);
}

// The request of `ValidateSeatMap`.
message ValidateSeatMapRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_map_id = 2;
  SeatMap seat_map = 3;
  ValidateSeatMapRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSeatMap`.
message ValidateSeatMapResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatMap seat_map = 1;
  ValidateSeatMapResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

