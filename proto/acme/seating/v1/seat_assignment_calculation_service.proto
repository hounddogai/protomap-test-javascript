syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatAssignmentCalculationServiceProto";
option java_package = "com.acme.seating.v1";

// Computes the figures of a seat assignment, such as totals, taxes, and estimates.
service SeatAssignmentCalculationService {
  // Calculates a seat assignment.
  rpc CalculateSeatAssignment(CalculateSeatAssignmentRequest) returns (CalculateSeatAssignmentResponse);

  // Estimates a seat assignment.
  rpc EstimateSeatAssignment(EstimateSeatAssignmentRequest) returns (EstimateSeatAssignmentResponse);

  // Quotes a seat assignment.
  rpc QuoteSeatAssignment(QuoteSeatAssignmentRequest) returns (QuoteSeatAssignmentResponse);

  // Compares a seat assignment.
  rpc CompareSeatAssignmentOptions(CompareSeatAssignmentOptionsRequest) returns (CompareSeatAssignmentOptionsResponse);

  // Recalculates a seat assignment.
  rpc RecalculateSeatAssignments(RecalculateSeatAssignmentsRequest) returns (RecalculateSeatAssignmentsResponse);

  // Simulates a seat assignment.
  rpc SimulateSeatAssignment(SimulateSeatAssignmentRequest) returns (SimulateSeatAssignmentResponse);

  // Explains a seat assignment.
  rpc ExplainSeatAssignmentCalculation(ExplainSeatAssignmentCalculationRequest) returns (ExplainSeatAssignmentCalculationResponse);
}

// The request of `CalculateSeatAssignment`.
message CalculateSeatAssignmentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_assignment_id = 2;
  SeatAssignment seat_assignment = 3;
  CalculateSeatAssignmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSeatAssignment`.
message CalculateSeatAssignmentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSeatAssignmentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  SeatAssignment seat_assignment = 1;
  CalculateSeatAssignmentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

