syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatAssignmentLifecycleServiceProto";
option java_package = "com.acme.seating.v1";

// Moves a seat assignment between the states of its lifecycle.
service SeatAssignmentLifecycleService {
  // Activates a seat assignment.
  rpc ActivateSeatAssignment(ActivateSeatAssignmentRequest) returns (ActivateSeatAssignmentResponse);

  // Suspends a seat assignment.
  rpc SuspendSeatAssignment(SuspendSeatAssignmentRequest) returns (SuspendSeatAssignmentResponse);

  // Reinstates a seat assignment.
  rpc ReinstateSeatAssignment(ReinstateSeatAssignmentRequest) returns (ReinstateSeatAssignmentResponse);

  // Terminates a seat assignment.
  rpc TerminateSeatAssignment(TerminateSeatAssignmentRequest) returns (TerminateSeatAssignmentResponse);

  // Renews a seat assignment.
  rpc RenewSeatAssignment(RenewSeatAssignmentRequest) returns (RenewSeatAssignmentResponse);

  // Expires a seat assignment.
  rpc ExpireSeatAssignment(ExpireSeatAssignmentRequest) returns (ExpireSeatAssignmentResponse);

  // Schedules a seat assignment.
  rpc ScheduleSeatAssignmentExpiry(ScheduleSeatAssignmentExpiryRequest) returns (ScheduleSeatAssignmentExpiryResponse);
}

// The request of `ActivateSeatAssignment`.
message ActivateSeatAssignmentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_assignment_id = 2;
  ActivateSeatAssignmentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateSeatAssignment`.
message ActivateSeatAssignmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatAssignment seat_assignment = 1;
  ActivateSeatAssignmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

