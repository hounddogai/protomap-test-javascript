// The request of `ListPendingSeatMaps`.
message ListPendingSeatMapsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatMapStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingSeatMapsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingSeatMaps`.
message ListPendingSeatMapsResponse {
  repeated SeatMap seat_maps = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

