syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatHoldApprovalServiceProto";
option java_package = "com.acme.seating.v1";

// Routes seat holds through approval, with escalation and delegation.
service SeatHoldApprovalService {
  // Submits a seat hold.
  rpc SubmitSeatHold(SubmitSeatHoldRequest) returns (SubmitSeatHoldResponse);

  // Approves a seat hold.
  rpc ApproveSeatHold(ApproveSeatHoldRequest) returns (ApproveSeatHoldResponse);

  // Rejects a seat hold.
  rpc RejectSeatHold(RejectSeatHoldRequest) returns (RejectSeatHoldResponse);

  // Escalates a seat hold.
  rpc EscalateSeatHold(EscalateSeatHoldRequest) returns (EscalateSeatHoldResponse);

  // Lists seat holds a page at a time.
  rpc ListPendingSeatHolds(ListPendingSeatHoldsRequest) returns (ListPendingSeatHoldsResponse);

  // Delegates a seat hold.
  rpc DelegateSeatHoldApproval(DelegateSeatHoldApprovalRequest) returns (DelegateSeatHoldApprovalResponse);

  // Recalls a seat hold.
  rpc RecallSeatHold(RecallSeatHoldRequest) returns (RecallSeatHoldResponse);

  // Returns a seat hold.
  rpc GetSeatHoldApprovalStatus(GetSeatHoldApprovalStatusRequest) returns (GetSeatHoldApprovalStatusResponse);

  // Comments a seat hold.
  rpc CommentSeatHoldApproval(CommentSeatHoldApprovalRequest) returns (CommentSeatHoldApprovalResponse);
}

// The request of `SubmitSeatHold`.
message SubmitSeatHoldRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_hold_id = 2;
  SeatHold seat_hold = 3;
  SubmitSeatHoldRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSeatHold`.
message SubmitSeatHoldResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatHold seat_hold = 1;
  SubmitSeatHoldResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

