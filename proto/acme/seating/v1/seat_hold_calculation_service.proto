syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatHoldCalculationServiceProto";
option java_package = "com.acme.seating.v1";

// Computes the figures of a seat hold, such as totals, taxes, and estimates.
service SeatHoldCalculationService {
  // Calculates a seat hold.
  rpc CalculateSeatHold(CalculateSeatHoldRequest) returns (CalculateSeatHoldResponse);

  // Estimates a seat hold.
  rpc EstimateSeatHold(EstimateSeatHoldRequest) returns (EstimateSeatHoldResponse);

  // Quotes a seat hold.
  rpc QuoteSeatHold(QuoteSeatHoldRequest) returns (QuoteSeatHoldResponse);

  // Compares a seat hold.
  rpc CompareSeatHoldOptions(CompareSeatHoldOptionsRequest) returns (CompareSeatHoldOptionsResponse);

  // Recalculates a seat hold.
  rpc RecalculateSeatHolds(RecalculateSeatHoldsRequest) returns (RecalculateSeatHoldsResponse);

  // Simulates a seat hold.
  rpc SimulateSeatHold(SimulateSeatHoldRequest) returns (SimulateSeatHoldResponse);

  // Explains a seat hold.
  rpc ExplainSeatHoldCalculation(ExplainSeatHoldCalculationRequest) returns (ExplainSeatHoldCalculationResponse);

  // Returns a seat hold.
  rpc GetSeatHoldRates(GetSeatHoldRatesRequest) returns (GetSeatHoldRatesResponse);
}

// The request of `CalculateSeatHold`.
message CalculateSeatHoldRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_hold_id = 2;
  SeatHold seat_hold = 3;
  CalculateSeatHoldRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSeatHold`.
message CalculateSeatHoldResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSeatHoldResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  SeatHold seat_hold = 1;
  CalculateSeatHoldResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

