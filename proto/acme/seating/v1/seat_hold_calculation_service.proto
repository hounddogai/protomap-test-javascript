    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatHold seat_hold = 1;
  ExplainSeatHoldCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetSeatHoldRates`.
message GetSeatHoldRatesRequest {
