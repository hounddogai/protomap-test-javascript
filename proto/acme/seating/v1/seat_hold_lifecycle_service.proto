syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatHoldLifecycleServiceProto";
option java_package = "com.acme.seating.v1";

// Moves a seat hold between the states of its lifecycle.
service SeatHoldLifecycleService {
  // Activates a seat hold.
  rpc ActivateSeatHold(ActivateSeatHoldRequest) returns (ActivateSeatHoldResponse);

  // Suspends a seat hold.
  rpc SuspendSeatHold(SuspendSeatHoldRequest) returns (SuspendSeatHoldResponse);

  // Reinstates a seat hold.
  rpc ReinstateSeatHold(ReinstateSeatHoldRequest) returns (ReinstateSeatHoldResponse);

  // Terminates a seat hold.
  rpc TerminateSeatHold(TerminateSeatHoldRequest) returns (TerminateSeatHoldResponse);

  // Renews a seat hold.
  rpc RenewSeatHold(RenewSeatHoldRequest) returns (RenewSeatHoldResponse);

  // Expires a seat hold.
  rpc ExpireSeatHold(ExpireSeatHoldRequest) returns (ExpireSeatHoldResponse);

  // Returns a seat hold.
  rpc GetSeatHoldLifecycle(GetSeatHoldLifecycleRequest) returns (GetSeatHoldLifecycleResponse);

  // Schedules a seat hold.
  rpc ScheduleSeatHoldExpiry(ScheduleSeatHoldExpiryRequest) returns (ScheduleSeatHoldExpiryResponse);
}

// The request of `ActivateSeatHold`.
message ActivateSeatHoldRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_hold_id = 2;
  ActivateSeatHoldRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateSeatHold`.
message ActivateSeatHoldResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatHold seat_hold = 1;
  ActivateSeatHoldResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

