syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatAssignmentReportingServiceProto";
option java_package = "com.acme.seating.v1";

// Builds and schedules reports about seat assignments.
service SeatAssignmentReportingService {
  // Generates a seat assignment.
  rpc GenerateSeatAssignmentReport(GenerateSeatAssignmentReportRequest) returns (GenerateSeatAssignmentReportResponse);

  // Returns a seat assignment.
  rpc FetchSeatAssignmentReport(FetchSeatAssignmentReportRequest) returns (FetchSeatAssignmentReportResponse);

  // Schedules a seat assignment.
  rpc ScheduleSeatAssignmentReport(ScheduleSeatAssignmentReportRequest) returns (ScheduleSeatAssignmentReportResponse);

  // Streams the changes of seat assignments as they happen.
  rpc StreamSeatAssignmentMetrics(StreamSeatAssignmentMetricsRequest) returns (stream StreamSeatAssignmentMetricsResponse);

  // Lists seat assignments a page at a time.
  rpc ListSeatAssignmentReports(ListSeatAssignmentReportsRequest) returns (ListSeatAssignmentReportsResponse);

  // Shares a seat assignment.
  rpc ShareSeatAssignmentReport(ShareSeatAssignmentReportRequest) returns (ShareSeatAssignmentReportResponse);

  // Counts seat assignments by status.
  rpc CountSeatAssignmentTotals(CountSeatAssignmentTotalsRequest) returns (CountSeatAssignmentTotalsResponse);

  // Deletes a seat assignment.
  rpc DeleteSeatAssignmentReport(DeleteSeatAssignmentReportRequest) returns (DeleteSeatAssignmentReportResponse);
}

// The request of `GenerateSeatAssignmentReport`.
message GenerateSeatAssignmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_assignment_id = 2;
  GenerateSeatAssignmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateSeatAssignmentReport`.
message GenerateSeatAssignmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchSeatAssignmentReport`.
message FetchSeatAssignmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string seat_assignment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchSeatAssignmentReport`.
message FetchSeatAssignmentReportResponse {
  SeatAssignment seat_assignment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleSeatAssignmentReport`.
message ScheduleSeatAssignmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_assignment_id = 2;
  ScheduleSeatAssignmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleSeatAssignmentReport`.
message ScheduleSeatAssignmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamSeatAssignmentMetrics`.
message StreamSeatAssignmentMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSeatAssignmentMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamSeatAssignmentMetrics`.
message StreamSeatAssignmentMetricsResponse {
  SeatAssignment seat_assignment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListSeatAssignmentReports`.
message ListSeatAssignmentReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSeatAssignmentReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSeatAssignmentReports`.
message ListSeatAssignmentReportsResponse {
  repeated SeatAssignment seat_assignments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareSeatAssignmentReport`.
message ShareSeatAssignmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_assignment_id = 2;
  ShareSeatAssignmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareSeatAssignmentReport`.
message ShareSeatAssignmentReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatAssignment seat_assignment = 1;
  ShareSeatAssignmentReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSeatAssignmentTotals`.
message CountSeatAssignmentTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSeatAssignmentTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSeatAssignmentTotals`.
message CountSeatAssignmentTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteSeatAssignmentReport`.
message DeleteSeatAssignmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string seat_assignment_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteSeatAssignmentReport`.
message DeleteSeatAssignmentReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
