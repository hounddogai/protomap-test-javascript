syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatAssignmentValidationServiceProto";
option java_package = "com.acme.seating.v1";

// Checks seat assignments against the rules before anything acts on them.
service SeatAssignmentValidationService {
  // Validates a seat assignment.
  rpc ValidateSeatAssignment(ValidateSeatAssignmentRequest) returns (ValidateSeatAssignmentResponse);

  // Previews a seat assignment.
  rpc PreviewSeatAssignment(PreviewSeatAssignmentRequest) returns (PreviewSeatAssignmentResponse);

  // Checks a seat assignment.
  rpc CheckSeatAssignmentEligibility(CheckSeatAssignmentEligibilityRequest) returns (CheckSeatAssignmentEligibilityResponse);

  // Normalizes a seat assignment.
  rpc NormalizeSeatAssignment(NormalizeSeatAssignmentRequest) returns (NormalizeSeatAssignmentResponse);

  // Explains a seat assignment.
  rpc ExplainSeatAssignmentDecision(ExplainSeatAssignmentDecisionRequest) returns (ExplainSeatAssignmentDecisionResponse);

  // Scores a seat assignment.
  rpc ScoreSeatAssignment(ScoreSeatAssignmentRequest) returns (ScoreSeatAssignmentResponse);

  // Lints a seat assignment.
  rpc LintSeatAssignments(LintSeatAssignmentsRequest) returns (LintSeatAssignmentsResponse);

  // Returns a seat assignment.
  rpc GetSeatAssignmentRules(GetSeatAssignmentRulesRequest) returns (GetSeatAssignmentRulesResponse);
}

// The request of `ValidateSeatAssignment`.
message ValidateSeatAssignmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_assignment_id = 2;
  SeatAssignment seat_assignment = 3;
  ValidateSeatAssignmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSeatAssignment`.
message ValidateSeatAssignmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatAssignment seat_assignment = 1;
  ValidateSeatAssignmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

