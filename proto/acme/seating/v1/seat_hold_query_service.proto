syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatHoldQueryServiceProto";
option java_package = "com.acme.seating.v1";

// Answers read-only questions about seat holds, for screens and reports.
service SeatHoldQueryService {
  // Returns a seat hold.
  rpc LookupSeatHold(LookupSeatHoldRequest) returns (LookupSeatHoldResponse);

  // Lists seat holds a page at a time.
  rpc BrowseSeatHolds(BrowseSeatHoldsRequest) returns (BrowseSeatHoldsResponse);

  // Lists seat holds a page at a time.
  rpc FindSeatHolds(FindSeatHoldsRequest) returns (FindSeatHoldsResponse);

  // Counts seat holds by status.
  rpc CountSeatHolds(CountSeatHoldsRequest) returns (CountSeatHoldsResponse);

  // Returns several seat holds at once.
  rpc ResolveSeatHolds(ResolveSeatHoldsRequest) returns (ResolveSeatHoldsResponse);

  // Streams every matching seat hold.
  rpc ExportSeatHolds(ExportSeatHoldsRequest) returns (stream ExportSeatHoldsResponse);

  // Summarizes a seat hold.
  rpc SummarizeSeatHolds(SummarizeSeatHoldsRequest) returns (SummarizeSeatHoldsResponse);

  // Lists seat holds a page at a time.
  rpc SuggestSeatHolds(SuggestSeatHoldsRequest) returns (SuggestSeatHoldsResponse);

  // Returns a seat hold.
  rpc PeekSeatHold(PeekSeatHoldRequest) returns (PeekSeatHoldResponse);
}

// The request of `LookupSeatHold`.
message LookupSeatHoldRequest {
  acme.common.v1.RequestContext context = 1;
  string seat_hold_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSeatHold`.
message LookupSeatHoldResponse {
  SeatHold seat_hold = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSeatHolds`.
message BrowseSeatHoldsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatHoldStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSeatHoldsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSeatHolds`.
message BrowseSeatHoldsResponse {
  repeated SeatHold seat_holds = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSeatHolds`.
message FindSeatHoldsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatHoldStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSeatHoldsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSeatHolds`.
message FindSeatHoldsResponse {
  repeated SeatHold seat_holds = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSeatHolds`.
message CountSeatHoldsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatHoldStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSeatHoldsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSeatHolds`.
message CountSeatHoldsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSeatHolds`.
message ResolveSeatHoldsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string seat_hold_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSeatHolds`.
message ResolveSeatHoldsResponse {
  repeated SeatHold seat_holds = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSeatHolds`.
message ExportSeatHoldsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatHoldStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSeatHoldsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSeatHolds`.
message ExportSeatHoldsResponse {
  SeatHold seat_hold = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSeatHolds`.
message SummarizeSeatHoldsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_hold_id = 2;
  SummarizeSeatHoldsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSeatHolds`.
message SummarizeSeatHoldsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSeatHolds`.
message SuggestSeatHoldsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SeatHoldStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSeatHoldsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSeatHolds`.
message SuggestSeatHoldsResponse {
  repeated SeatHold seat_holds = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekSeatHold`.
message PeekSeatHoldRequest {
  acme.common.v1.RequestContext context = 1;
  string seat_hold_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSeatHold`.
message PeekSeatHoldResponse {
  SeatHold seat_hold = 1;
  acme.common.v1.OperationResult result = 2;
}
