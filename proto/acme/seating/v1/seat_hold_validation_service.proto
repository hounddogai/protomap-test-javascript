syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatHoldValidationServiceProto";
option java_package = "com.acme.seating.v1";

// Checks seat holds against the rules before anything acts on them.
service SeatHoldValidationService {
  // Validates a seat hold.
  rpc ValidateSeatHold(ValidateSeatHoldRequest) returns (ValidateSeatHoldResponse);

  // Previews a seat hold.
  rpc PreviewSeatHold(PreviewSeatHoldRequest) returns (PreviewSeatHoldResponse);

  // Checks a seat hold.
  rpc CheckSeatHoldEligibility(CheckSeatHoldEligibilityRequest) returns (CheckSeatHoldEligibilityResponse);

  // Explains a seat hold.
  rpc ExplainSeatHoldDecision(ExplainSeatHoldDecisionRequest) returns (ExplainSeatHoldDecisionResponse);

  // Scores a seat hold.
  rpc ScoreSeatHold(ScoreSeatHoldRequest) returns (ScoreSeatHoldResponse);

  // Lints a seat hold.
  rpc LintSeatHolds(LintSeatHoldsRequest) returns (LintSeatHoldsResponse);
}

// The request of `ValidateSeatHold`.
message ValidateSeatHoldRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_hold_id = 2;
  SeatHold seat_hold = 3;
  ValidateSeatHoldRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSeatHold`.
message ValidateSeatHoldResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatHold seat_hold = 1;
  ValidateSeatHoldResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

