syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatMapWorkflowServiceProto";
option java_package = "com.acme.seating.v1";

// Runs the long-lived workflow that takes a seat map from start to finish.
service SeatMapWorkflowService {
  // Starts a seat map.
  rpc StartSeatMapWorkflow(StartSeatMapWorkflowRequest) returns (StartSeatMapWorkflowResponse);

  // Advances a seat map.
  rpc AdvanceSeatMapWorkflow(AdvanceSeatMapWorkflowRequest) returns (AdvanceSeatMapWorkflowResponse);

  // Retrys a seat map.
  rpc RetrySeatMapWorkflow(RetrySeatMapWorkflowRequest) returns (RetrySeatMapWorkflowResponse);

  // Pauses a seat map.
  rpc PauseSeatMapWorkflow(PauseSeatMapWorkflowRequest) returns (PauseSeatMapWorkflowResponse);

  // Resumes a seat map.
  rpc ResumeSeatMapWorkflow(ResumeSeatMapWorkflowRequest) returns (ResumeSeatMapWorkflowResponse);

  // Returns a seat map.
  rpc InspectSeatMapWorkflow(InspectSeatMapWorkflowRequest) returns (InspectSeatMapWorkflowResponse);

  // Lists seat maps a page at a time.
  rpc ListSeatMapWorkflows(ListSeatMapWorkflowsRequest) returns (ListSeatMapWorkflowsResponse);

  // Signals a seat map.
  rpc SignalSeatMapWorkflow(SignalSeatMapWorkflowRequest) returns (SignalSeatMapWorkflowResponse);
}

// The request of `StartSeatMapWorkflow`.
message StartSeatMapWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_map_id = 2;
  SeatMap seat_map = 3;
  StartSeatMapWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSeatMapWorkflow`.
message StartSeatMapWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatMap seat_map = 1;
  StartSeatMapWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

