syntax = "proto3";

package acme.seating.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/seating/v1/seating.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Seating.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/seating/v1;seatingv1";
option java_multiple_files = true;
option java_outer_classname = "SeatAssignmentApprovalServiceProto";
option java_package = "com.acme.seating.v1";

// Routes seat assignments through approval, with escalation and delegation.
service SeatAssignmentApprovalService {
  // Submits a seat assignment.
  rpc SubmitSeatAssignment(SubmitSeatAssignmentRequest) returns (SubmitSeatAssignmentResponse);

  // Approves a seat assignment.
  rpc ApproveSeatAssignment(ApproveSeatAssignmentRequest) returns (ApproveSeatAssignmentResponse);

  // Rejects a seat assignment.
  rpc RejectSeatAssignment(RejectSeatAssignmentRequest) returns (RejectSeatAssignmentResponse);

  // Escalates a seat assignment.
  rpc EscalateSeatAssignment(EscalateSeatAssignmentRequest) returns (EscalateSeatAssignmentResponse);

  // Lists seat assignments a page at a time.
  rpc ListPendingSeatAssignments(ListPendingSeatAssignmentsRequest) returns (ListPendingSeatAssignmentsResponse);

  // Recalls a seat assignment.
  rpc RecallSeatAssignment(RecallSeatAssignmentRequest) returns (RecallSeatAssignmentResponse);

  // Returns a seat assignment.
  rpc GetSeatAssignmentApprovalStatus(GetSeatAssignmentApprovalStatusRequest) returns (GetSeatAssignmentApprovalStatusResponse);
}

// The request of `SubmitSeatAssignment`.
message SubmitSeatAssignmentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string seat_assignment_id = 2;
  SeatAssignment seat_assignment = 3;
  SubmitSeatAssignmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSeatAssignment`.
message SubmitSeatAssignmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SeatAssignment seat_assignment = 1;
  SubmitSeatAssignmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveSeatAssignment`.
message ApproveSeatAssignmentRequest {
  // What the operation needs besides the record.
