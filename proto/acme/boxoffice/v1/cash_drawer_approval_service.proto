syntax = "proto3";

package acme.boxoffice.v1;

import "acme/boxoffice/v1/boxoffice.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Boxoffice.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/boxoffice/v1;boxofficev1";
option java_multiple_files = true;
option java_outer_classname = "CashDrawerApprovalServiceProto";
option java_package = "com.acme.boxoffice.v1";

// Routes cash drawers through approval, with escalation and delegation.
service CashDrawerApprovalService {
  // Submits a cash drawer.
  rpc SubmitCashDrawer(SubmitCashDrawerRequest) returns (SubmitCashDrawerResponse);

  // Approves a cash drawer.
  rpc ApproveCashDrawer(ApproveCashDrawerRequest) returns (ApproveCashDrawerResponse);

  // Rejects a cash drawer.
  rpc RejectCashDrawer(RejectCashDrawerRequest) returns (RejectCashDrawerResponse);

  // Escalates a cash drawer.
  rpc EscalateCashDrawer(EscalateCashDrawerRequest) returns (EscalateCashDrawerResponse);

  // Lists cash drawers a page at a time.
  rpc ListPendingCashDrawers(ListPendingCashDrawersRequest) returns (ListPendingCashDrawersResponse);

  // Recalls a cash drawer.
  rpc RecallCashDrawer(RecallCashDrawerRequest) returns (RecallCashDrawerResponse);

  // Comments a cash drawer.
  rpc CommentCashDrawerApproval(CommentCashDrawerApprovalRequest) returns (CommentCashDrawerApprovalResponse);
}

// The request of `SubmitCashDrawer`.
message SubmitCashDrawerRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cash_drawer_id = 2;
  CashDrawer cash_drawer = 3;
  SubmitCashDrawerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCashDrawer`.
message SubmitCashDrawerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CashDrawer cash_drawer = 1;
  SubmitCashDrawerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

