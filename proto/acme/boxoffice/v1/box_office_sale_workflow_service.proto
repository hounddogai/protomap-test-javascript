option java_package = "com.acme.boxoffice.v1";

// Runs the long-lived workflow that takes a box office sale from start to finish.
service BoxOfficeSaleWorkflowService {
  // Starts a box office sale.
  rpc StartBoxOfficeSaleWorkflow(StartBoxOfficeSaleWorkflowRequest) returns (StartBoxOfficeSaleWorkflowResponse);

  // Advances a box office sale.
  rpc AdvanceBoxOfficeSaleWorkflow(AdvanceBoxOfficeSaleWorkflowRequest) returns (AdvanceBoxOfficeSaleWorkflowResponse);

  // Cancels a box office sale.
  rpc CancelBoxOfficeSaleWorkflow(CancelBoxOfficeSaleWorkflowRequest) returns (CancelBoxOfficeSaleWorkflowResponse);

  // Retrys a box office sale.
  rpc RetryBoxOfficeSaleWorkflow(RetryBoxOfficeSaleWorkflowRequest) returns (RetryBoxOfficeSaleWorkflowResponse);

  // Pauses a box office sale.
  rpc PauseBoxOfficeSaleWorkflow(PauseBoxOfficeSaleWorkflowRequest) returns (PauseBoxOfficeSaleWorkflowResponse);

  // Resumes a box office sale.
  rpc ResumeBoxOfficeSaleWorkflow(ResumeBoxOfficeSaleWorkflowRequest) returns (ResumeBoxOfficeSaleWorkflowResponse);

  // Returns a box office sale.
  rpc InspectBoxOfficeSaleWorkflow(InspectBoxOfficeSaleWorkflowRequest) returns (InspectBoxOfficeSaleWorkflowResponse);

  // Lists box office sales a page at a time.
  rpc ListBoxOfficeSaleWorkflows(ListBoxOfficeSaleWorkflowsRequest) returns (ListBoxOfficeSaleWorkflowsResponse);

  // Signals a box office sale.
  rpc SignalBoxOfficeSaleWorkflow(SignalBoxOfficeSaleWorkflowRequest) returns (SignalBoxOfficeSaleWorkflowResponse);
}

// The request of `StartBoxOfficeSaleWorkflow`.
message StartBoxOfficeSaleWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string box_office_sale_id = 2;
  BoxOfficeSale box_office_sale = 3;
  StartBoxOfficeSaleWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartBoxOfficeSaleWorkflow`.
message StartBoxOfficeSaleWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BoxOfficeSale box_office_sale = 1;
  StartBoxOfficeSaleWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

