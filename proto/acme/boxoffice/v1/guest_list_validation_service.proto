syntax = "proto3";

package acme.boxoffice.v1;

import "acme/boxoffice/v1/boxoffice.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Boxoffice.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/boxoffice/v1;boxofficev1";
option java_multiple_files = true;
option java_outer_classname = "GuestListValidationServiceProto";
option java_package = "com.acme.boxoffice.v1";

// Checks guest lists against the rules before anything acts on them.
service GuestListValidationService {
  // Validates a guest list.
  rpc ValidateGuestList(ValidateGuestListRequest) returns (ValidateGuestListResponse);

  // Previews a guest list.
  rpc PreviewGuestList(PreviewGuestListRequest) returns (PreviewGuestListResponse);

  // Checks a guest list.
  rpc CheckGuestListEligibility(CheckGuestListEligibilityRequest) returns (CheckGuestListEligibilityResponse);

  // Normalizes a guest list.
  rpc NormalizeGuestList(NormalizeGuestListRequest) returns (NormalizeGuestListResponse);

  // Explains a guest list.
  rpc ExplainGuestListDecision(ExplainGuestListDecisionRequest) returns (ExplainGuestListDecisionResponse);

  // Scores a guest list.
  rpc ScoreGuestList(ScoreGuestListRequest) returns (ScoreGuestListResponse);

  // Lints a guest list.
  rpc LintGuestLists(LintGuestListsRequest) returns (LintGuestListsResponse);

  // Returns a guest list.
  rpc GetGuestListRules(GetGuestListRulesRequest) returns (GetGuestListRulesResponse);
}

// The request of `ValidateGuestList`.
message ValidateGuestListRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string guest_list_id = 2;
  GuestList guest_list = 3;
  ValidateGuestListRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateGuestList`.
message ValidateGuestListResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GuestList guest_list = 1;
  ValidateGuestListResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

