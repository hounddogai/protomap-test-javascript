syntax = "proto3";

package acme.boxoffice.v1;

import "acme/boxoffice/v1/boxoffice.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Boxoffice.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/boxoffice/v1;boxofficev1";
option java_multiple_files = true;
option java_outer_classname = "CashDrawerCalculationServiceProto";
option java_package = "com.acme.boxoffice.v1";

// Computes the figures of a cash drawer, such as totals, taxes, and estimates.
service CashDrawerCalculationService {
  // Calculates a cash drawer.
  rpc CalculateCashDrawer(CalculateCashDrawerRequest) returns (CalculateCashDrawerResponse);

  // Estimates a cash drawer.
  rpc EstimateCashDrawer(EstimateCashDrawerRequest) returns (EstimateCashDrawerResponse);

  // Compares a cash drawer.
  rpc CompareCashDrawerOptions(CompareCashDrawerOptionsRequest) returns (CompareCashDrawerOptionsResponse);

  // Recalculates a cash drawer.
  rpc RecalculateCashDrawers(RecalculateCashDrawersRequest) returns (RecalculateCashDrawersResponse);

  // Explains a cash drawer.
  rpc ExplainCashDrawerCalculation(ExplainCashDrawerCalculationRequest) returns (ExplainCashDrawerCalculationResponse);

  // Returns a cash drawer.
  rpc GetCashDrawerRates(GetCashDrawerRatesRequest) returns (GetCashDrawerRatesResponse);
}

// The request of `CalculateCashDrawer`.
message CalculateCashDrawerRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cash_drawer_id = 2;
  CashDrawer cash_drawer = 3;
  CalculateCashDrawerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCashDrawer`.
message CalculateCashDrawerResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCashDrawerResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CashDrawer cash_drawer = 1;
  CalculateCashDrawerResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

