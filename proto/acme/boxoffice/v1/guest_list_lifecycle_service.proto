option csharp_namespace = "Acme.Boxoffice.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/boxoffice/v1;boxofficev1";
option java_multiple_files = true;
option java_outer_classname = "GuestListLifecycleServiceProto";
option java_package = "com.acme.boxoffice.v1";

// Moves a guest list between the states of its lifecycle.
service GuestListLifecycleService {
  // Activates a guest list.
  rpc ActivateGuestList(ActivateGuestListRequest) returns (ActivateGuestListResponse);

  // Suspends a guest list.
  rpc SuspendGuestList(SuspendGuestListRequest) returns (SuspendGuestListResponse);

  // Reinstates a guest list.
  rpc ReinstateGuestList(ReinstateGuestListRequest) returns (ReinstateGuestListResponse);

  // Terminates a guest list.
  rpc TerminateGuestList(TerminateGuestListRequest) returns (TerminateGuestListResponse);

  // Renews a guest list.
  rpc RenewGuestList(RenewGuestListRequest) returns (RenewGuestListResponse);

  // Expires a guest list.
  rpc ExpireGuestList(ExpireGuestListRequest) returns (ExpireGuestListResponse);

  // Returns a guest list.
  rpc GetGuestListLifecycle(GetGuestListLifecycleRequest) returns (GetGuestListLifecycleResponse);

  // Schedules a guest list.
  rpc ScheduleGuestListExpiry(ScheduleGuestListExpiryRequest) returns (ScheduleGuestListExpiryResponse);
}

// The request of `ActivateGuestList`.
message ActivateGuestListRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string guest_list_id = 2;
  ActivateGuestListRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateGuestList`.
message ActivateGuestListResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GuestList guest_list = 1;
  ActivateGuestListResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

