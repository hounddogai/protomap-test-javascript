import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Boxoffice.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/boxoffice/v1;boxofficev1";
option java_multiple_files = true;
option java_outer_classname = "CashDrawerWorkflowServiceProto";
option java_package = "com.acme.boxoffice.v1";

// Runs the long-lived workflow that takes a cash drawer from start to finish.
service CashDrawerWorkflowService {
  // Starts a cash drawer.
  rpc StartCashDrawerWorkflow(StartCashDrawerWorkflowRequest) returns (StartCashDrawerWorkflowResponse);

  // Advances a cash drawer.
  rpc AdvanceCashDrawerWorkflow(AdvanceCashDrawerWorkflowRequest) returns (AdvanceCashDrawerWorkflowResponse);

  // Cancels a cash drawer.
  rpc CancelCashDrawerWorkflow(CancelCashDrawerWorkflowRequest) returns (CancelCashDrawerWorkflowResponse);

  // Retrys a cash drawer.
  rpc RetryCashDrawerWorkflow(RetryCashDrawerWorkflowRequest) returns (RetryCashDrawerWorkflowResponse);

  // Pauses a cash drawer.
  rpc PauseCashDrawerWorkflow(PauseCashDrawerWorkflowRequest) returns (PauseCashDrawerWorkflowResponse);

  // Resumes a cash drawer.
  rpc ResumeCashDrawerWorkflow(ResumeCashDrawerWorkflowRequest) returns (ResumeCashDrawerWorkflowResponse);

  // Returns a cash drawer.
  rpc InspectCashDrawerWorkflow(InspectCashDrawerWorkflowRequest) returns (InspectCashDrawerWorkflowResponse);

  // Lists cash drawers a page at a time.
  rpc ListCashDrawerWorkflows(ListCashDrawerWorkflowsRequest) returns (ListCashDrawerWorkflowsResponse);

  // Signals a cash drawer.
  rpc SignalCashDrawerWorkflow(SignalCashDrawerWorkflowRequest) returns (SignalCashDrawerWorkflowResponse);
}

// The request of `StartCashDrawerWorkflow`.
message StartCashDrawerWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cash_drawer_id = 2;
  CashDrawer cash_drawer = 3;
  StartCashDrawerWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCashDrawerWorkflow`.
message StartCashDrawerWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CashDrawer cash_drawer = 1;
  StartCashDrawerWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

