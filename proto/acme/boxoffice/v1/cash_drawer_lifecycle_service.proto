option csharp_namespace = "Acme.Boxoffice.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/boxoffice/v1;boxofficev1";
option java_multiple_files = true;
option java_outer_classname = "CashDrawerLifecycleServiceProto";
option java_package = "com.acme.boxoffice.v1";

// Moves a cash drawer between the states of its lifecycle.
service CashDrawerLifecycleService {
  // Activates a cash drawer.
  rpc ActivateCashDrawer(ActivateCashDrawerRequest) returns (ActivateCashDrawerResponse);

  // Suspends a cash drawer.
  rpc SuspendCashDrawer(SuspendCashDrawerRequest) returns (SuspendCashDrawerResponse);

  // Reinstates a cash drawer.
  rpc ReinstateCashDrawer(ReinstateCashDrawerRequest) returns (ReinstateCashDrawerResponse);

  // Terminates a cash drawer.
  rpc TerminateCashDrawer(TerminateCashDrawerRequest) returns (TerminateCashDrawerResponse);

  // Renews a cash drawer.
  rpc RenewCashDrawer(RenewCashDrawerRequest) returns (RenewCashDrawerResponse);

  // Expires a cash drawer.
  rpc ExpireCashDrawer(ExpireCashDrawerRequest) returns (ExpireCashDrawerResponse);

  // Returns a cash drawer.
  rpc GetCashDrawerLifecycle(GetCashDrawerLifecycleRequest) returns (GetCashDrawerLifecycleResponse);

  // Schedules a cash drawer.
  rpc ScheduleCashDrawerExpiry(ScheduleCashDrawerExpiryRequest) returns (ScheduleCashDrawerExpiryResponse);
}

// The request of `ActivateCashDrawer`.
message ActivateCashDrawerRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string cash_drawer_id = 2;
  ActivateCashDrawerRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCashDrawer`.
message ActivateCashDrawerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CashDrawer cash_drawer = 1;
  ActivateCashDrawerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

