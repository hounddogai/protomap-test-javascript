syntax = "proto3";

package acme.boxoffice.v1;

import "acme/boxoffice/v1/boxoffice.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Boxoffice.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/boxoffice/v1;boxofficev1";
option java_multiple_files = true;
option java_outer_classname = "GuestListCalculationServiceProto";
option java_package = "com.acme.boxoffice.v1";

// Computes the figures of a guest list, such as totals, taxes, and estimates.
service GuestListCalculationService {
  // Calculates a guest list.
  rpc CalculateGuestList(CalculateGuestListRequest) returns (CalculateGuestListResponse);

  // Estimates a guest list.
  rpc EstimateGuestList(EstimateGuestListRequest) returns (EstimateGuestListResponse);

  // Quotes a guest list.
  rpc QuoteGuestList(QuoteGuestListRequest) returns (QuoteGuestListResponse);

  // Compares a guest list.
  rpc CompareGuestListOptions(CompareGuestListOptionsRequest) returns (CompareGuestListOptionsResponse);

  // Recalculates a guest list.
  rpc RecalculateGuestLists(RecalculateGuestListsRequest) returns (RecalculateGuestListsResponse);

  // Simulates a guest list.
  rpc SimulateGuestList(SimulateGuestListRequest) returns (SimulateGuestListResponse);

  // Explains a guest list.
  rpc ExplainGuestListCalculation(ExplainGuestListCalculationRequest) returns (ExplainGuestListCalculationResponse);

  // Returns a guest list.
  rpc GetGuestListRates(GetGuestListRatesRequest) returns (GetGuestListRatesResponse);
}

// The request of `CalculateGuestList`.
message CalculateGuestListRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string guest_list_id = 2;
  GuestList guest_list = 3;
  CalculateGuestListRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateGuestList`.
message CalculateGuestListResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateGuestListResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  GuestList guest_list = 1;
  CalculateGuestListResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

