syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shows/v1/shows.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "LineupValidationServiceProto";
option java_package = "com.acme.shows.v1";

// Checks lineups against the rules before anything acts on them.
service LineupValidationService {
  // Validates a lineup.
  rpc ValidateLineup(ValidateLineupRequest) returns (ValidateLineupResponse);

  // Previews a lineup.
  rpc PreviewLineup(PreviewLineupRequest) returns (PreviewLineupResponse);

  // Checks a lineup.
  rpc CheckLineupEligibility(CheckLineupEligibilityRequest) returns (CheckLineupEligibilityResponse);

  // Normalizes a lineup.
  rpc NormalizeLineup(NormalizeLineupRequest) returns (NormalizeLineupResponse);

  // Explains a lineup.
  rpc ExplainLineupDecision(ExplainLineupDecisionRequest) returns (ExplainLineupDecisionResponse);

  // Scores a lineup.
  rpc ScoreLineup(ScoreLineupRequest) returns (ScoreLineupResponse);

  // Lints a lineup.
  rpc LintLineups(LintLineupsRequest) returns (LintLineupsResponse);

  // Returns a lineup.
  rpc GetLineupRules(GetLineupRulesRequest) returns (GetLineupRulesResponse);
}

// The request of `ValidateLineup`.
message ValidateLineupRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string lineup_id = 2;
  Lineup lineup = 3;
  ValidateLineupRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLineup`.
message ValidateLineupResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Lineup lineup = 1;
  ValidateLineupResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

