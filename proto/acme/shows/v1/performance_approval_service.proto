syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/shows/v1/shows.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "PerformanceApprovalServiceProto";
option java_package = "com.acme.shows.v1";

// Routes performances through approval, with escalation and delegation.
service PerformanceApprovalService {
  // Submits a performance.
  rpc SubmitPerformance(SubmitPerformanceRequest) returns (SubmitPerformanceResponse);

  // Approves a performance.
  rpc ApprovePerformance(ApprovePerformanceRequest) returns (ApprovePerformanceResponse);

  // Rejects a performance.
  rpc RejectPerformance(RejectPerformanceRequest) returns (RejectPerformanceResponse);

  // Escalates a performance.
  rpc EscalatePerformance(EscalatePerformanceRequest) returns (EscalatePerformanceResponse);

  // Lists performances a page at a time.
  rpc ListPendingPerformances(ListPendingPerformancesRequest) returns (ListPendingPerformancesResponse);

  // Delegates a performance.
  rpc DelegatePerformanceApproval(DelegatePerformanceApprovalRequest) returns (DelegatePerformanceApprovalResponse);

  // Recalls a performance.
  rpc RecallPerformance(RecallPerformanceRequest) returns (RecallPerformanceResponse);

  // Returns a performance.
  rpc GetPerformanceApprovalStatus(GetPerformanceApprovalStatusRequest) returns (GetPerformanceApprovalStatusResponse);

  // Comments a performance.
  rpc CommentPerformanceApproval(CommentPerformanceApprovalRequest) returns (CommentPerformanceApprovalResponse);
}

// The request of `SubmitPerformance`.
message SubmitPerformanceRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string performance_id = 2;
  Performance performance = 3;
  SubmitPerformanceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPerformance`.
message SubmitPerformanceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Performance performance = 1;
  SubmitPerformanceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

