// The request of `GetShowRules`.
message GetShowRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string show_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetShowRules`.
message GetShowRulesResponse {
  Show show = 1;
  acme.common.v1.OperationResult result = 2;
}
