option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "LineupWorkflowServiceProto";
option java_package = "com.acme.shows.v1";

// Runs the long-lived workflow that takes a lineup from start to finish.
service LineupWorkflowService {
  // Starts a lineup.
  rpc StartLineupWorkflow(StartLineupWorkflowRequest) returns (StartLineupWorkflowResponse);

  // Advances a lineup.
  rpc AdvanceLineupWorkflow(AdvanceLineupWorkflowRequest) returns (AdvanceLineupWorkflowResponse);

  // Cancels a lineup.
  rpc CancelLineupWorkflow(CancelLineupWorkflowRequest) returns (CancelLineupWorkflowResponse);

  // Retrys a lineup.
  rpc RetryLineupWorkflow(RetryLineupWorkflowRequest) returns (RetryLineupWorkflowResponse);

  // Pauses a lineup.
  rpc PauseLineupWorkflow(PauseLineupWorkflowRequest) returns (PauseLineupWorkflowResponse);

  // Resumes a lineup.
  rpc ResumeLineupWorkflow(ResumeLineupWorkflowRequest) returns (ResumeLineupWorkflowResponse);

  // Returns a lineup.
  rpc InspectLineupWorkflow(InspectLineupWorkflowRequest) returns (InspectLineupWorkflowResponse);

  // Lists lineups a page at a time.
  rpc ListLineupWorkflows(ListLineupWorkflowsRequest) returns (ListLineupWorkflowsResponse);

  // Signals a lineup.
  rpc SignalLineupWorkflow(SignalLineupWorkflowRequest) returns (SignalLineupWorkflowResponse);
}

// The request of `StartLineupWorkflow`.
message StartLineupWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineup_id = 2;
  Lineup lineup = 3;
  StartLineupWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartLineupWorkflow`.
message StartLineupWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Lineup lineup = 1;
  StartLineupWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

