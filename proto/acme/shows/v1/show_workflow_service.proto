syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/shows/v1/shows.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "ShowWorkflowServiceProto";
option java_package = "com.acme.shows.v1";

// Runs the long-lived workflow that takes a show from start to finish.
service ShowWorkflowService {
  // Starts a show.
  rpc StartShowWorkflow(StartShowWorkflowRequest) returns (StartShowWorkflowResponse);

  // Advances a show.
  rpc AdvanceShowWorkflow(AdvanceShowWorkflowRequest) returns (AdvanceShowWorkflowResponse);

  // Cancels a show.
  rpc CancelShowWorkflow(CancelShowWorkflowRequest) returns (CancelShowWorkflowResponse);

  // Retrys a show.
  rpc RetryShowWorkflow(RetryShowWorkflowRequest) returns (RetryShowWorkflowResponse);

  // Pauses a show.
  rpc PauseShowWorkflow(PauseShowWorkflowRequest) returns (PauseShowWorkflowResponse);

  // Resumes a show.
  rpc ResumeShowWorkflow(ResumeShowWorkflowRequest) returns (ResumeShowWorkflowResponse);

  // Returns a show.
  rpc InspectShowWorkflow(InspectShowWorkflowRequest) returns (InspectShowWorkflowResponse);

  // Lists shows a page at a time.
  rpc ListShowWorkflows(ListShowWorkflowsRequest) returns (ListShowWorkflowsResponse);

  // Signals a show.
  rpc SignalShowWorkflow(SignalShowWorkflowRequest) returns (SignalShowWorkflowResponse);
}

// The request of `StartShowWorkflow`.
message StartShowWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string show_id = 2;
  Show show = 3;
  StartShowWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartShowWorkflow`.
message StartShowWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Show show = 1;
  StartShowWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

