syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shows/v1/shows.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "PerformanceCalculationServiceProto";
option java_package = "com.acme.shows.v1";

// Computes the figures of a performance, such as totals, taxes, and estimates.
service PerformanceCalculationService {
  // Calculates a performance.
  rpc CalculatePerformance(CalculatePerformanceRequest) returns (CalculatePerformanceResponse);

  // Estimates a performance.
  rpc EstimatePerformance(EstimatePerformanceRequest) returns (EstimatePerformanceResponse);

  // Quotes a performance.
  rpc QuotePerformance(QuotePerformanceRequest) returns (QuotePerformanceResponse);

  // Compares a performance.
  rpc ComparePerformanceOptions(ComparePerformanceOptionsRequest) returns (ComparePerformanceOptionsResponse);

  // Recalculates a performance.
  rpc RecalculatePerformances(RecalculatePerformancesRequest) returns (RecalculatePerformancesResponse);

  // Simulates a performance.
  rpc SimulatePerformance(SimulatePerformanceRequest) returns (SimulatePerformanceResponse);

  // Explains a performance.
  rpc ExplainPerformanceCalculation(ExplainPerformanceCalculationRequest) returns (ExplainPerformanceCalculationResponse);

  // Returns a performance.
  rpc GetPerformanceRates(GetPerformanceRatesRequest) returns (GetPerformanceRatesResponse);
}

// The request of `CalculatePerformance`.
message CalculatePerformanceRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string performance_id = 2;
  Performance performance = 3;
  CalculatePerformanceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePerformance`.
message CalculatePerformanceResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePerformanceResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Performance performance = 1;
  CalculatePerformanceResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

