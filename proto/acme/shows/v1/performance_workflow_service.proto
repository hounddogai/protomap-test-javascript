syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/shows/v1/shows.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "PerformanceWorkflowServiceProto";
option java_package = "com.acme.shows.v1";

// Runs the long-lived workflow that takes a performance from start to finish.
service PerformanceWorkflowService {
  // Starts a performance.
  rpc StartPerformanceWorkflow(StartPerformanceWorkflowRequest) returns (StartPerformanceWorkflowResponse);

  // Advances a performance.
  rpc AdvancePerformanceWorkflow(AdvancePerformanceWorkflowRequest) returns (AdvancePerformanceWorkflowResponse);

  // Retrys a performance.
  rpc RetryPerformanceWorkflow(RetryPerformanceWorkflowRequest) returns (RetryPerformanceWorkflowResponse);

  // Pauses a performance.
  rpc PausePerformanceWorkflow(PausePerformanceWorkflowRequest) returns (PausePerformanceWorkflowResponse);

  // Resumes a performance.
  rpc ResumePerformanceWorkflow(ResumePerformanceWorkflowRequest) returns (ResumePerformanceWorkflowResponse);

  // Lists performances a page at a time.
  rpc ListPerformanceWorkflows(ListPerformanceWorkflowsRequest) returns (ListPerformanceWorkflowsResponse);

  // Signals a performance.
  rpc SignalPerformanceWorkflow(SignalPerformanceWorkflowRequest) returns (SignalPerformanceWorkflowResponse);
}

// The request of `StartPerformanceWorkflow`.
message StartPerformanceWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string performance_id = 2;
  Performance performance = 3;
  StartPerformanceWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPerformanceWorkflow`.
message StartPerformanceWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Performance performance = 1;
  StartPerformanceWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

