syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/shows/v1/shows.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "LineupLifecycleServiceProto";
option java_package = "com.acme.shows.v1";

// Moves a lineup between the states of its lifecycle.
service LineupLifecycleService {
  // Activates a lineup.
  rpc ActivateLineup(ActivateLineupRequest) returns (ActivateLineupResponse);

  // Suspends a lineup.
  rpc SuspendLineup(SuspendLineupRequest) returns (SuspendLineupResponse);

  // Reinstates a lineup.
  rpc ReinstateLineup(ReinstateLineupRequest) returns (ReinstateLineupResponse);

  // Terminates a lineup.
  rpc TerminateLineup(TerminateLineupRequest) returns (TerminateLineupResponse);

  // Expires a lineup.
  rpc ExpireLineup(ExpireLineupRequest) returns (ExpireLineupResponse);

  // Returns a lineup.
  rpc GetLineupLifecycle(GetLineupLifecycleRequest) returns (GetLineupLifecycleResponse);

  // Schedules a lineup.
  rpc ScheduleLineupExpiry(ScheduleLineupExpiryRequest) returns (ScheduleLineupExpiryResponse);
}

// The request of `ActivateLineup`.
message ActivateLineupRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string lineup_id = 2;
  ActivateLineupRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateLineup`.
message ActivateLineupResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Lineup lineup = 1;
  ActivateLineupResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

