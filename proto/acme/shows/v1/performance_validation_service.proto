syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/shows/v1/shows.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "PerformanceValidationServiceProto";
option java_package = "com.acme.shows.v1";

// Checks performances against the rules before anything acts on them.
service PerformanceValidationService {
  // Validates a performance.
  rpc ValidatePerformance(ValidatePerformanceRequest) returns (ValidatePerformanceResponse);

  // Previews a performance.
  rpc PreviewPerformance(PreviewPerformanceRequest) returns (PreviewPerformanceResponse);

  // Checks a performance.
  rpc CheckPerformanceEligibility(CheckPerformanceEligibilityRequest) returns (CheckPerformanceEligibilityResponse);

  // Normalizes a performance.
  rpc NormalizePerformance(NormalizePerformanceRequest) returns (NormalizePerformanceResponse);

  // Explains a performance.
  rpc ExplainPerformanceDecision(ExplainPerformanceDecisionRequest) returns (ExplainPerformanceDecisionResponse);

  // Scores a performance.
  rpc ScorePerformance(ScorePerformanceRequest) returns (ScorePerformanceResponse);

  // Lints a performance.
  rpc LintPerformances(LintPerformancesRequest) returns (LintPerformancesResponse);

  // Returns a performance.
  rpc GetPerformanceRules(GetPerformanceRulesRequest) returns (GetPerformanceRulesResponse);
}

// The request of `ValidatePerformance`.
message ValidatePerformanceRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string performance_id = 2;
  Performance performance = 3;
  ValidatePerformanceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePerformance`.
message ValidatePerformanceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Performance performance = 1;
  ValidatePerformanceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

