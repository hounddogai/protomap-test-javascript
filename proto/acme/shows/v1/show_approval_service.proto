syntax = "proto3";

package acme.shows.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/shows/v1/shows.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Shows.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/shows/v1;showsv1";
option java_multiple_files = true;
option java_outer_classname = "ShowApprovalServiceProto";
option java_package = "com.acme.shows.v1";

// Routes shows through approval, with escalation and delegation.
service ShowApprovalService {
  // Submits a show.
  rpc SubmitShow(SubmitShowRequest) returns (SubmitShowResponse);

  // Approves a show.
  rpc ApproveShow(ApproveShowRequest) returns (ApproveShowResponse);

  // Rejects a show.
  rpc RejectShow(RejectShowRequest) returns (RejectShowResponse);

  // Escalates a show.
  rpc EscalateShow(EscalateShowRequest) returns (EscalateShowResponse);

  // Lists shows a page at a time.
  rpc ListPendingShows(ListPendingShowsRequest) returns (ListPendingShowsResponse);

  // Delegates a show.
  rpc DelegateShowApproval(DelegateShowApprovalRequest) returns (DelegateShowApprovalResponse);

  // Recalls a show.
  rpc RecallShow(RecallShowRequest) returns (RecallShowResponse);

  // Returns a show.
  rpc GetShowApprovalStatus(GetShowApprovalStatusRequest) returns (GetShowApprovalStatusResponse);
}

// The request of `SubmitShow`.
message SubmitShowRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string show_id = 2;
  Show show = 3;
  SubmitShowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitShow`.
message SubmitShowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Show show = 1;
  SubmitShowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

