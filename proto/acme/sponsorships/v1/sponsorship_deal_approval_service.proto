  ApproveSponsorshipDealRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ApproveSponsorshipDeal`.
message ApproveSponsorshipDealResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SponsorshipDeal sponsorship_deal = 1;
  ApproveSponsorshipDealResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

