message GetSponsorshipDealApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string sponsorship_deal_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSponsorshipDealApprovalStatus`.
message GetSponsorshipDealApprovalStatusResponse {
