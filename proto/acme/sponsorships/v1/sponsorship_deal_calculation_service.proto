syntax = "proto3";

package acme.sponsorships.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/sponsorships/v1/sponsorships.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "SponsorshipDealCalculationServiceProto";
option java_package = "com.acme.sponsorships.v1";

// Computes the figures of a sponsorship deal, such as totals, taxes, and estimates.
service SponsorshipDealCalculationService {
  // Calculates a sponsorship deal.
  rpc CalculateSponsorshipDeal(CalculateSponsorshipDealRequest) returns (CalculateSponsorshipDealResponse);

  // Estimates a sponsorship deal.
  rpc EstimateSponsorshipDeal(EstimateSponsorshipDealRequest) returns (EstimateSponsorshipDealResponse);

  // Quotes a sponsorship deal.
  rpc QuoteSponsorshipDeal(QuoteSponsorshipDealRequest) returns (QuoteSponsorshipDealResponse);

  // Compares a sponsorship deal.
  rpc CompareSponsorshipDealOptions(CompareSponsorshipDealOptionsRequest) returns (CompareSponsorshipDealOptionsResponse);

  // Recalculates a sponsorship deal.
  rpc RecalculateSponsorshipDeals(RecalculateSponsorshipDealsRequest) returns (RecalculateSponsorshipDealsResponse);

  // Returns a sponsorship deal.
  rpc GetSponsorshipDealRates(GetSponsorshipDealRatesRequest) returns (GetSponsorshipDealRatesResponse);
}

// The request of `CalculateSponsorshipDeal`.
message CalculateSponsorshipDealRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sponsorship_deal_id = 2;
  SponsorshipDeal sponsorship_deal = 3;
  CalculateSponsorshipDealRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSponsorshipDeal`.
message CalculateSponsorshipDealResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSponsorshipDealResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  SponsorshipDeal sponsorship_deal = 1;
  CalculateSponsorshipDealResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

