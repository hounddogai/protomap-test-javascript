syntax = "proto3";

package acme.sponsorships.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/sponsorships/v1/sponsorships.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "ActivationCalculationServiceProto";
option java_package = "com.acme.sponsorships.v1";

// Computes the figures of an activation, such as totals, taxes, and estimates.
service ActivationCalculationService {
  // Calculates an activation.
  rpc CalculateActivation(CalculateActivationRequest) returns (CalculateActivationResponse);

  // Estimates an activation.
  rpc EstimateActivation(EstimateActivationRequest) returns (EstimateActivationResponse);

  // Quotes an activation.
  rpc QuoteActivation(QuoteActivationRequest) returns (QuoteActivationResponse);

  // Compares an activation.
  rpc CompareActivationOptions(CompareActivationOptionsRequest) returns (CompareActivationOptionsResponse);

  // Recalculates an activation.
  rpc RecalculateActivations(RecalculateActivationsRequest) returns (RecalculateActivationsResponse);

  // Simulates an activation.
  rpc SimulateActivation(SimulateActivationRequest) returns (SimulateActivationResponse);

  // Returns an activation.
  rpc GetActivationRates(GetActivationRatesRequest) returns (GetActivationRatesResponse);
}

// The request of `CalculateActivation`.
message CalculateActivationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string activation_id = 2;
  Activation activation = 3;
  CalculateActivationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateActivation`.
message CalculateActivationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateActivationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Activation activation = 1;
  CalculateActivationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

