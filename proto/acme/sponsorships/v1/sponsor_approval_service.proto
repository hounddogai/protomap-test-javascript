syntax = "proto3";

package acme.sponsorships.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/sponsorships/v1/sponsorships.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "SponsorApprovalServiceProto";
option java_package = "com.acme.sponsorships.v1";

// Routes sponsors through approval, with escalation and delegation.
service SponsorApprovalService {
  // Submits a sponsor.
  rpc SubmitSponsor(SubmitSponsorRequest) returns (SubmitSponsorResponse);

  // Approves a sponsor.
  rpc ApproveSponsor(ApproveSponsorRequest) returns (ApproveSponsorResponse);

  // Rejects a sponsor.
  rpc RejectSponsor(RejectSponsorRequest) returns (RejectSponsorResponse);

  // Escalates a sponsor.
  rpc EscalateSponsor(EscalateSponsorRequest) returns (EscalateSponsorResponse);

  // Lists sponsors a page at a time.
  rpc ListPendingSponsors(ListPendingSponsorsRequest) returns (ListPendingSponsorsResponse);

  // Delegates a sponsor.
  rpc DelegateSponsorApproval(DelegateSponsorApprovalRequest) returns (DelegateSponsorApprovalResponse);

  // Recalls a sponsor.
  rpc RecallSponsor(RecallSponsorRequest) returns (RecallSponsorResponse);

  // Returns a sponsor.
  rpc GetSponsorApprovalStatus(GetSponsorApprovalStatusRequest) returns (GetSponsorApprovalStatusResponse);

  // Comments a sponsor.
  rpc CommentSponsorApproval(CommentSponsorApprovalRequest) returns (CommentSponsorApprovalResponse);
}

// The request of `SubmitSponsor`.
message SubmitSponsorRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sponsor_id = 2;
  Sponsor sponsor = 3;
  SubmitSponsorRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSponsor`.
message SubmitSponsorResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Sponsor sponsor = 1;
  SubmitSponsorResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

