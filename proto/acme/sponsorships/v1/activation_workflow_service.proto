syntax = "proto3";

package acme.sponsorships.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/sponsorships/v1/sponsorships.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "ActivationWorkflowServiceProto";
option java_package = "com.acme.sponsorships.v1";

// Runs the long-lived workflow that takes an activation from start to finish.
service ActivationWorkflowService {
  // Starts an activation.
  rpc StartActivationWorkflow(StartActivationWorkflowRequest) returns (StartActivationWorkflowResponse);

  // Advances an activation.
  rpc AdvanceActivationWorkflow(AdvanceActivationWorkflowRequest) returns (AdvanceActivationWorkflowResponse);

  // Cancels an activation.
  rpc CancelActivationWorkflow(CancelActivationWorkflowRequest) returns (CancelActivationWorkflowResponse);

  // Retrys an activation.
  rpc RetryActivationWorkflow(RetryActivationWorkflowRequest) returns (RetryActivationWorkflowResponse);

  // Pauses an activation.
  rpc PauseActivationWorkflow(PauseActivationWorkflowRequest) returns (PauseActivationWorkflowResponse);

  // Resumes an activation.
  rpc ResumeActivationWorkflow(ResumeActivationWorkflowRequest) returns (ResumeActivationWorkflowResponse);

  // Returns an activation.
  rpc InspectActivationWorkflow(InspectActivationWorkflowRequest) returns (InspectActivationWorkflowResponse);

  // Lists activations a page at a time.
  rpc ListActivationWorkflows(ListActivationWorkflowsRequest) returns (ListActivationWorkflowsResponse);

  // Signals an activation.
  rpc SignalActivationWorkflow(SignalActivationWorkflowRequest) returns (SignalActivationWorkflowResponse);
}

// The request of `StartActivationWorkflow`.
message StartActivationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string activation_id = 2;
  Activation activation = 3;
  StartActivationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartActivationWorkflow`.
message StartActivationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Activation activation = 1;
  StartActivationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

