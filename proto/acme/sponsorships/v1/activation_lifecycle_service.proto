syntax = "proto3";

package acme.sponsorships.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/sponsorships/v1/sponsorships.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "ActivationLifecycleServiceProto";
option java_package = "com.acme.sponsorships.v1";

// Moves an activation between the states of its lifecycle.
service ActivationLifecycleService {
  // Activates an activation.
  rpc ActivateActivation(ActivateActivationRequest) returns (ActivateActivationResponse);

  // Suspends an activation.
  rpc SuspendActivation(SuspendActivationRequest) returns (SuspendActivationResponse);

  // Reinstates an activation.
  rpc ReinstateActivation(ReinstateActivationRequest) returns (ReinstateActivationResponse);

  // Terminates an activation.
  rpc TerminateActivation(TerminateActivationRequest) returns (TerminateActivationResponse);

  // Renews an activation.
  rpc RenewActivation(RenewActivationRequest) returns (RenewActivationResponse);

  // Expires an activation.
  rpc ExpireActivation(ExpireActivationRequest) returns (ExpireActivationResponse);

  // Returns an activation.
  rpc GetActivationLifecycle(GetActivationLifecycleRequest) returns (GetActivationLifecycleResponse);

  // Schedules an activation.
  rpc ScheduleActivationExpiry(ScheduleActivationExpiryRequest) returns (ScheduleActivationExpiryResponse);
}

// The request of `ActivateActivation`.
message ActivateActivationRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string activation_id = 2;
  ActivateActivationRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateActivation`.
message ActivateActivationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Activation activation = 1;
  ActivateActivationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

