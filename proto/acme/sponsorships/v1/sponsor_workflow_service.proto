syntax = "proto3";

package acme.sponsorships.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/sponsorships/v1/sponsorships.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Sponsorships.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/sponsorships/v1;sponsorshipsv1";
option java_multiple_files = true;
option java_outer_classname = "SponsorWorkflowServiceProto";
option java_package = "com.acme.sponsorships.v1";

// Runs the long-lived workflow that takes a sponsor from start to finish.
service SponsorWorkflowService {
  // Starts a sponsor.
  rpc StartSponsorWorkflow(StartSponsorWorkflowRequest) returns (StartSponsorWorkflowResponse);

  // Advances a sponsor.
  rpc AdvanceSponsorWorkflow(AdvanceSponsorWorkflowRequest) returns (AdvanceSponsorWorkflowResponse);

  // Cancels a sponsor.
  rpc CancelSponsorWorkflow(CancelSponsorWorkflowRequest) returns (CancelSponsorWorkflowResponse);

  // Retrys a sponsor.
  rpc RetrySponsorWorkflow(RetrySponsorWorkflowRequest) returns (RetrySponsorWorkflowResponse);

  // Pauses a sponsor.
  rpc PauseSponsorWorkflow(PauseSponsorWorkflowRequest) returns (PauseSponsorWorkflowResponse);

  // Resumes a sponsor.
  rpc ResumeSponsorWorkflow(ResumeSponsorWorkflowRequest) returns (ResumeSponsorWorkflowResponse);

  // Returns a sponsor.
  rpc InspectSponsorWorkflow(InspectSponsorWorkflowRequest) returns (InspectSponsorWorkflowResponse);

  // Lists sponsors a page at a time.
  rpc ListSponsorWorkflows(ListSponsorWorkflowsRequest) returns (ListSponsorWorkflowsResponse);

  // Signals a sponsor.
  rpc SignalSponsorWorkflow(SignalSponsorWorkflowRequest) returns (SignalSponsorWorkflowResponse);
}

// The request of `StartSponsorWorkflow`.
message StartSponsorWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sponsor_id = 2;
  Sponsor sponsor = 3;
  StartSponsorWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSponsorWorkflow`.
message StartSponsorWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Sponsor sponsor = 1;
  StartSponsorWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

