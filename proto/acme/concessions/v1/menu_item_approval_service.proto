syntax = "proto3";

package acme.concessions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/concessions/v1/concessions.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "MenuItemApprovalServiceProto";
option java_package = "com.acme.concessions.v1";

// Routes menu items through approval, with escalation and delegation.
service MenuItemApprovalService {
  // Submits a menu item.
  rpc SubmitMenuItem(SubmitMenuItemRequest) returns (SubmitMenuItemResponse);

  // Approves a menu item.
  rpc ApproveMenuItem(ApproveMenuItemRequest) returns (ApproveMenuItemResponse);

  // Rejects a menu item.
  rpc RejectMenuItem(RejectMenuItemRequest) returns (RejectMenuItemResponse);

  // Escalates a menu item.
  rpc EscalateMenuItem(EscalateMenuItemRequest) returns (EscalateMenuItemResponse);

  // Lists menu items a page at a time.
  rpc ListPendingMenuItems(ListPendingMenuItemsRequest) returns (ListPendingMenuItemsResponse);

  // Delegates a menu item.
  rpc DelegateMenuItemApproval(DelegateMenuItemApprovalRequest) returns (DelegateMenuItemApprovalResponse);

  // Recalls a menu item.
  rpc RecallMenuItem(RecallMenuItemRequest) returns (RecallMenuItemResponse);

  // Returns a menu item.
  rpc GetMenuItemApprovalStatus(GetMenuItemApprovalStatusRequest) returns (GetMenuItemApprovalStatusResponse);

  // Comments a menu item.
  rpc CommentMenuItemApproval(CommentMenuItemApprovalRequest) returns (CommentMenuItemApprovalResponse);
}

// The request of `SubmitMenuItem`.
message SubmitMenuItemRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string menu_item_id = 2;
  MenuItem menu_item = 3;
  SubmitMenuItemRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitMenuItem`.
message SubmitMenuItemResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MenuItem menu_item = 1;
  SubmitMenuItemResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

