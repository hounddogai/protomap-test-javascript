option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "ConcessionStandWorkflowServiceProto";
option java_package = "com.acme.concessions.v1";

// Runs the long-lived workflow that takes a concession stand from start to finish.
service ConcessionStandWorkflowService {
  // Starts a concession stand.
  rpc StartConcessionStandWorkflow(StartConcessionStandWorkflowRequest) returns (StartConcessionStandWorkflowResponse);

  // Advances a concession stand.
  rpc AdvanceConcessionStandWorkflow(AdvanceConcessionStandWorkflowRequest) returns (AdvanceConcessionStandWorkflowResponse);

  // Cancels a concession stand.
  rpc CancelConcessionStandWorkflow(CancelConcessionStandWorkflowRequest) returns (CancelConcessionStandWorkflowResponse);

  // Retrys a concession stand.
  rpc RetryConcessionStandWorkflow(RetryConcessionStandWorkflowRequest) returns (RetryConcessionStandWorkflowResponse);

  // Pauses a concession stand.
  rpc PauseConcessionStandWorkflow(PauseConcessionStandWorkflowRequest) returns (PauseConcessionStandWorkflowResponse);

  // Resumes a concession stand.
  rpc ResumeConcessionStandWorkflow(ResumeConcessionStandWorkflowRequest) returns (ResumeConcessionStandWorkflowResponse);

  // Returns a concession stand.
  rpc InspectConcessionStandWorkflow(InspectConcessionStandWorkflowRequest) returns (InspectConcessionStandWorkflowResponse);

  // Lists concession stands a page at a time.
  rpc ListConcessionStandWorkflows(ListConcessionStandWorkflowsRequest) returns (ListConcessionStandWorkflowsResponse);

  // Signals a concession stand.
  rpc SignalConcessionStandWorkflow(SignalConcessionStandWorkflowRequest) returns (SignalConcessionStandWorkflowResponse);
}

// The request of `StartConcessionStandWorkflow`.
message StartConcessionStandWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_stand_id = 2;
  ConcessionStand concession_stand = 3;
  StartConcessionStandWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartConcessionStandWorkflow`.
message StartConcessionStandWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConcessionStand concession_stand = 1;
  StartConcessionStandWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

