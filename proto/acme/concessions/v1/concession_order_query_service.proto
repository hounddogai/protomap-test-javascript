syntax = "proto3";

package acme.concessions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/concessions/v1/concessions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "ConcessionOrderQueryServiceProto";
option java_package = "com.acme.concessions.v1";

// Answers read-only questions about concession orders, for screens and reports.
service ConcessionOrderQueryService {
  // Returns a concession order.
  rpc LookupConcessionOrder(LookupConcessionOrderRequest) returns (LookupConcessionOrderResponse);

  // Lists concession orders a page at a time.
  rpc BrowseConcessionOrders(BrowseConcessionOrdersRequest) returns (BrowseConcessionOrdersResponse);

  // Lists concession orders a page at a time.
  rpc FindConcessionOrders(FindConcessionOrdersRequest) returns (FindConcessionOrdersResponse);

  // Counts concession orders by status.
  rpc CountConcessionOrders(CountConcessionOrdersRequest) returns (CountConcessionOrdersResponse);

  // Returns several concession orders at once.
  rpc ResolveConcessionOrders(ResolveConcessionOrdersRequest) returns (ResolveConcessionOrdersResponse);

  // Streams every matching concession order.
  rpc ExportConcessionOrders(ExportConcessionOrdersRequest) returns (stream ExportConcessionOrdersResponse);

  // Summarizes a concession order.
  rpc SummarizeConcessionOrders(SummarizeConcessionOrdersRequest) returns (SummarizeConcessionOrdersResponse);

  // Lists concession orders a page at a time.
  rpc SuggestConcessionOrders(SuggestConcessionOrdersRequest) returns (SuggestConcessionOrdersResponse);

  // Returns a concession order.
  rpc PeekConcessionOrder(PeekConcessionOrderRequest) returns (PeekConcessionOrderResponse);
}

// The request of `LookupConcessionOrder`.
message LookupConcessionOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupConcessionOrder`.
message LookupConcessionOrderResponse {
  ConcessionOrder concession_order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseConcessionOrders`.
message BrowseConcessionOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseConcessionOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseConcessionOrders`.
message BrowseConcessionOrdersResponse {
  repeated ConcessionOrder concession_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindConcessionOrders`.
message FindConcessionOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindConcessionOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindConcessionOrders`.
message FindConcessionOrdersResponse {
  repeated ConcessionOrder concession_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountConcessionOrders`.
message CountConcessionOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountConcessionOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountConcessionOrders`.
message CountConcessionOrdersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveConcessionOrders`.
message ResolveConcessionOrdersRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string concession_order_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveConcessionOrders`.
message ResolveConcessionOrdersResponse {
  repeated ConcessionOrder concession_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportConcessionOrders`.
message ExportConcessionOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportConcessionOrdersRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportConcessionOrders`.
message ExportConcessionOrdersResponse {
  ConcessionOrder concession_order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeConcessionOrders`.
message SummarizeConcessionOrdersRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  SummarizeConcessionOrdersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeConcessionOrders`.
message SummarizeConcessionOrdersResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestConcessionOrders`.
message SuggestConcessionOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestConcessionOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestConcessionOrders`.
message SuggestConcessionOrdersResponse {
  repeated ConcessionOrder concession_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekConcessionOrder`.
message PeekConcessionOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekConcessionOrder`.
message PeekConcessionOrderResponse {
  ConcessionOrder concession_order = 1;
  acme.common.v1.OperationResult result = 2;
}
