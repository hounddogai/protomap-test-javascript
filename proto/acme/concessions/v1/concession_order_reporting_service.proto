syntax = "proto3";

package acme.concessions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/concessions/v1/concessions.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "ConcessionOrderReportingServiceProto";
option java_package = "com.acme.concessions.v1";

// Builds and schedules reports about concession orders.
service ConcessionOrderReportingService {
  // Generates a concession order.
  rpc GenerateConcessionOrderReport(GenerateConcessionOrderReportRequest) returns (GenerateConcessionOrderReportResponse);

  // Returns a concession order.
  rpc FetchConcessionOrderReport(FetchConcessionOrderReportRequest) returns (FetchConcessionOrderReportResponse);

  // Schedules a concession order.
  rpc ScheduleConcessionOrderReport(ScheduleConcessionOrderReportRequest) returns (ScheduleConcessionOrderReportResponse);

  // Streams the changes of concession orders as they happen.
  rpc StreamConcessionOrderMetrics(StreamConcessionOrderMetricsRequest) returns (stream StreamConcessionOrderMetricsResponse);

  // Lists concession orders a page at a time.
  rpc ListConcessionOrderReports(ListConcessionOrderReportsRequest) returns (ListConcessionOrderReportsResponse);

  // Shares a concession order.
  rpc ShareConcessionOrderReport(ShareConcessionOrderReportRequest) returns (ShareConcessionOrderReportResponse);

  // Counts concession orders by status.
  rpc CountConcessionOrderTotals(CountConcessionOrderTotalsRequest) returns (CountConcessionOrderTotalsResponse);

  // Deletes a concession order.
  rpc DeleteConcessionOrderReport(DeleteConcessionOrderReportRequest) returns (DeleteConcessionOrderReportResponse);
}

// The request of `GenerateConcessionOrderReport`.
message GenerateConcessionOrderReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  GenerateConcessionOrderReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateConcessionOrderReport`.
message GenerateConcessionOrderReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchConcessionOrderReport`.
message FetchConcessionOrderReportRequest {
  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchConcessionOrderReport`.
message FetchConcessionOrderReportResponse {
  ConcessionOrder concession_order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleConcessionOrderReport`.
message ScheduleConcessionOrderReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  ScheduleConcessionOrderReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleConcessionOrderReport`.
message ScheduleConcessionOrderReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamConcessionOrderMetrics`.
message StreamConcessionOrderMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamConcessionOrderMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamConcessionOrderMetrics`.
message StreamConcessionOrderMetricsResponse {
  ConcessionOrder concession_order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListConcessionOrderReports`.
message ListConcessionOrderReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListConcessionOrderReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListConcessionOrderReports`.
message ListConcessionOrderReportsResponse {
  repeated ConcessionOrder concession_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareConcessionOrderReport`.
message ShareConcessionOrderReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  ShareConcessionOrderReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareConcessionOrderReport`.
message ShareConcessionOrderReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConcessionOrder concession_order = 1;
  ShareConcessionOrderReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountConcessionOrderTotals`.
message CountConcessionOrderTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConcessionOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountConcessionOrderTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountConcessionOrderTotals`.
message CountConcessionOrderTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteConcessionOrderReport`.
message DeleteConcessionOrderReportRequest {
  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteConcessionOrderReport`.
message DeleteConcessionOrderReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
