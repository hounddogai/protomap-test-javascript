syntax = "proto3";

package acme.concessions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/concessions/v1/concessions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "MenuItemWorkflowServiceProto";
option java_package = "com.acme.concessions.v1";

// Runs the long-lived workflow that takes a menu item from start to finish.
service MenuItemWorkflowService {
  // Starts a menu item.
  rpc StartMenuItemWorkflow(StartMenuItemWorkflowRequest) returns (StartMenuItemWorkflowResponse);

  // Advances a menu item.
  rpc AdvanceMenuItemWorkflow(AdvanceMenuItemWorkflowRequest) returns (AdvanceMenuItemWorkflowResponse);

  // Retrys a menu item.
  rpc RetryMenuItemWorkflow(RetryMenuItemWorkflowRequest) returns (RetryMenuItemWorkflowResponse);

  // Pauses a menu item.
  rpc PauseMenuItemWorkflow(PauseMenuItemWorkflowRequest) returns (PauseMenuItemWorkflowResponse);

  // Returns a menu item.
  rpc InspectMenuItemWorkflow(InspectMenuItemWorkflowRequest) returns (InspectMenuItemWorkflowResponse);

  // Lists menu items a page at a time.
  rpc ListMenuItemWorkflows(ListMenuItemWorkflowsRequest) returns (ListMenuItemWorkflowsResponse);

  // Signals a menu item.
  rpc SignalMenuItemWorkflow(SignalMenuItemWorkflowRequest) returns (SignalMenuItemWorkflowResponse);
}

// The request of `StartMenuItemWorkflow`.
message StartMenuItemWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string menu_item_id = 2;
  MenuItem menu_item = 3;
  StartMenuItemWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartMenuItemWorkflow`.
message StartMenuItemWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MenuItem menu_item = 1;
  StartMenuItemWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

