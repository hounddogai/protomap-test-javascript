syntax = "proto3";

package acme.concessions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/concessions/v1/concessions.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "ConcessionStandValidationServiceProto";
option java_package = "com.acme.concessions.v1";

// Checks concession stands against the rules before anything acts on them.
service ConcessionStandValidationService {
  // Validates a concession stand.
  rpc ValidateConcessionStand(ValidateConcessionStandRequest) returns (ValidateConcessionStandResponse);

  // Previews a concession stand.
  rpc PreviewConcessionStand(PreviewConcessionStandRequest) returns (PreviewConcessionStandResponse);

  // Checks a concession stand.
  rpc CheckConcessionStandEligibility(CheckConcessionStandEligibilityRequest) returns (CheckConcessionStandEligibilityResponse);

  // Explains a concession stand.
  rpc ExplainConcessionStandDecision(ExplainConcessionStandDecisionRequest) returns (ExplainConcessionStandDecisionResponse);

  // Scores a concession stand.
  rpc ScoreConcessionStand(ScoreConcessionStandRequest) returns (ScoreConcessionStandResponse);

  // Lints a concession stand.
  rpc LintConcessionStands(LintConcessionStandsRequest) returns (LintConcessionStandsResponse);
}

// The request of `ValidateConcessionStand`.
message ValidateConcessionStandRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_stand_id = 2;
  ConcessionStand concession_stand = 3;
  ValidateConcessionStandRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateConcessionStand`.
message ValidateConcessionStandResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConcessionStand concession_stand = 1;
  ValidateConcessionStandResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

