option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "ConcessionOrderLifecycleServiceProto";
option java_package = "com.acme.concessions.v1";

// Moves a concession order between the states of its lifecycle.
service ConcessionOrderLifecycleService {
  // Activates a concession order.
  rpc ActivateConcessionOrder(ActivateConcessionOrderRequest) returns (ActivateConcessionOrderResponse);

  // Suspends a concession order.
  rpc SuspendConcessionOrder(SuspendConcessionOrderRequest) returns (SuspendConcessionOrderResponse);

  // Reinstates a concession order.
  rpc ReinstateConcessionOrder(ReinstateConcessionOrderRequest) returns (ReinstateConcessionOrderResponse);

  // Terminates a concession order.
  rpc TerminateConcessionOrder(TerminateConcessionOrderRequest) returns (TerminateConcessionOrderResponse);

  // Renews a concession order.
  rpc RenewConcessionOrder(RenewConcessionOrderRequest) returns (RenewConcessionOrderResponse);

  // Expires a concession order.
  rpc ExpireConcessionOrder(ExpireConcessionOrderRequest) returns (ExpireConcessionOrderResponse);

  // Returns a concession order.
  rpc GetConcessionOrderLifecycle(GetConcessionOrderLifecycleRequest) returns (GetConcessionOrderLifecycleResponse);

  // Schedules a concession order.
  rpc ScheduleConcessionOrderExpiry(ScheduleConcessionOrderExpiryRequest) returns (ScheduleConcessionOrderExpiryResponse);
}

// The request of `ActivateConcessionOrder`.
message ActivateConcessionOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  ActivateConcessionOrderRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateConcessionOrder`.
message ActivateConcessionOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConcessionOrder concession_order = 1;
  ActivateConcessionOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

