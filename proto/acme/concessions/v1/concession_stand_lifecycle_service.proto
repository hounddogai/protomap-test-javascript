option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "ConcessionStandLifecycleServiceProto";
option java_package = "com.acme.concessions.v1";

// Moves a concession stand between the states of its lifecycle.
service ConcessionStandLifecycleService {
  // Activates a concession stand.
  rpc ActivateConcessionStand(ActivateConcessionStandRequest) returns (ActivateConcessionStandResponse);

  // Suspends a concession stand.
  rpc SuspendConcessionStand(SuspendConcessionStandRequest) returns (SuspendConcessionStandResponse);

  // Reinstates a concession stand.
  rpc ReinstateConcessionStand(ReinstateConcessionStandRequest) returns (ReinstateConcessionStandResponse);

  // Terminates a concession stand.
  rpc TerminateConcessionStand(TerminateConcessionStandRequest) returns (TerminateConcessionStandResponse);

  // Renews a concession stand.
  rpc RenewConcessionStand(RenewConcessionStandRequest) returns (RenewConcessionStandResponse);

  // Expires a concession stand.
  rpc ExpireConcessionStand(ExpireConcessionStandRequest) returns (ExpireConcessionStandResponse);

  // Returns a concession stand.
  rpc GetConcessionStandLifecycle(GetConcessionStandLifecycleRequest) returns (GetConcessionStandLifecycleResponse);

  // Schedules a concession stand.
  rpc ScheduleConcessionStandExpiry(ScheduleConcessionStandExpiryRequest) returns (ScheduleConcessionStandExpiryResponse);
}

// The request of `ActivateConcessionStand`.
message ActivateConcessionStandRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_stand_id = 2;
  ActivateConcessionStandRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateConcessionStand`.
message ActivateConcessionStandResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConcessionStand concession_stand = 1;
  ActivateConcessionStandResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

