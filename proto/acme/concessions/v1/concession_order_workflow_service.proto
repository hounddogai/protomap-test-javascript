option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "ConcessionOrderWorkflowServiceProto";
option java_package = "com.acme.concessions.v1";

// Runs the long-lived workflow that takes a concession order from start to finish.
service ConcessionOrderWorkflowService {
  // Starts a concession order.
  rpc StartConcessionOrderWorkflow(StartConcessionOrderWorkflowRequest) returns (StartConcessionOrderWorkflowResponse);

  // Advances a concession order.
  rpc AdvanceConcessionOrderWorkflow(AdvanceConcessionOrderWorkflowRequest) returns (AdvanceConcessionOrderWorkflowResponse);

  // Cancels a concession order.
  rpc CancelConcessionOrderWorkflow(CancelConcessionOrderWorkflowRequest) returns (CancelConcessionOrderWorkflowResponse);

  // Retrys a concession order.
  rpc RetryConcessionOrderWorkflow(RetryConcessionOrderWorkflowRequest) returns (RetryConcessionOrderWorkflowResponse);

  // Resumes a concession order.
  rpc ResumeConcessionOrderWorkflow(ResumeConcessionOrderWorkflowRequest) returns (ResumeConcessionOrderWorkflowResponse);

  // Returns a concession order.
  rpc InspectConcessionOrderWorkflow(InspectConcessionOrderWorkflowRequest) returns (InspectConcessionOrderWorkflowResponse);

  // Lists concession orders a page at a time.
  rpc ListConcessionOrderWorkflows(ListConcessionOrderWorkflowsRequest) returns (ListConcessionOrderWorkflowsResponse);

  // Signals a concession order.
  rpc SignalConcessionOrderWorkflow(SignalConcessionOrderWorkflowRequest) returns (SignalConcessionOrderWorkflowResponse);
}

// The request of `StartConcessionOrderWorkflow`.
message StartConcessionOrderWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_order_id = 2;
  ConcessionOrder concession_order = 3;
  StartConcessionOrderWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartConcessionOrderWorkflow`.
message StartConcessionOrderWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConcessionOrder concession_order = 1;
  StartConcessionOrderWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

