option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "MenuItemLifecycleServiceProto";
option java_package = "com.acme.concessions.v1";

// Moves a menu item between the states of its lifecycle.
service MenuItemLifecycleService {
  // Activates a menu item.
  rpc ActivateMenuItem(ActivateMenuItemRequest) returns (ActivateMenuItemResponse);

  // Suspends a menu item.
  rpc SuspendMenuItem(SuspendMenuItemRequest) returns (SuspendMenuItemResponse);

  // Reinstates a menu item.
  rpc ReinstateMenuItem(ReinstateMenuItemRequest) returns (ReinstateMenuItemResponse);

  // Terminates a menu item.
  rpc TerminateMenuItem(TerminateMenuItemRequest) returns (TerminateMenuItemResponse);

  // Renews a menu item.
  rpc RenewMenuItem(RenewMenuItemRequest) returns (RenewMenuItemResponse);

  // Expires a menu item.
  rpc ExpireMenuItem(ExpireMenuItemRequest) returns (ExpireMenuItemResponse);

  // Returns a menu item.
  rpc GetMenuItemLifecycle(GetMenuItemLifecycleRequest) returns (GetMenuItemLifecycleResponse);

  // Schedules a menu item.
  rpc ScheduleMenuItemExpiry(ScheduleMenuItemExpiryRequest) returns (ScheduleMenuItemExpiryResponse);
}

// The request of `ActivateMenuItem`.
message ActivateMenuItemRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string menu_item_id = 2;
  ActivateMenuItemRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateMenuItem`.
message ActivateMenuItemResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MenuItem menu_item = 1;
  ActivateMenuItemResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

