syntax = "proto3";

package acme.concessions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/concessions/v1/concessions.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "ConcessionStandApprovalServiceProto";
option java_package = "com.acme.concessions.v1";

// Routes concession stands through approval, with escalation and delegation.
service ConcessionStandApprovalService {
  // Submits a concession stand.
  rpc SubmitConcessionStand(SubmitConcessionStandRequest) returns (SubmitConcessionStandResponse);

  // Approves a concession stand.
  rpc ApproveConcessionStand(ApproveConcessionStandRequest) returns (ApproveConcessionStandResponse);

  // Rejects a concession stand.
  rpc RejectConcessionStand(RejectConcessionStandRequest) returns (RejectConcessionStandResponse);

  // Escalates a concession stand.
  rpc EscalateConcessionStand(EscalateConcessionStandRequest) returns (EscalateConcessionStandResponse);

  // Lists concession stands a page at a time.
  rpc ListPendingConcessionStands(ListPendingConcessionStandsRequest) returns (ListPendingConcessionStandsResponse);

  // Delegates a concession stand.
  rpc DelegateConcessionStandApproval(DelegateConcessionStandApprovalRequest) returns (DelegateConcessionStandApprovalResponse);

  // Recalls a concession stand.
  rpc RecallConcessionStand(RecallConcessionStandRequest) returns (RecallConcessionStandResponse);

  // Returns a concession stand.
  rpc GetConcessionStandApprovalStatus(GetConcessionStandApprovalStatusRequest) returns (GetConcessionStandApprovalStatusResponse);
}

// The request of `SubmitConcessionStand`.
message SubmitConcessionStandRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string concession_stand_id = 2;
  ConcessionStand concession_stand = 3;
  SubmitConcessionStandRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitConcessionStand`.
message SubmitConcessionStandResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConcessionStand concession_stand = 1;
  SubmitConcessionStandResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

