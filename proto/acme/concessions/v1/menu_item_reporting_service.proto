syntax = "proto3";

package acme.concessions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/concessions/v1/concessions.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "MenuItemReportingServiceProto";
option java_package = "com.acme.concessions.v1";

// Builds and schedules reports about menu items.
service MenuItemReportingService {
  // Generates a menu item.
  rpc GenerateMenuItemReport(GenerateMenuItemReportRequest) returns (GenerateMenuItemReportResponse);

  // Returns a menu item.
  rpc FetchMenuItemReport(FetchMenuItemReportRequest) returns (FetchMenuItemReportResponse);

  // Schedules a menu item.
  rpc ScheduleMenuItemReport(ScheduleMenuItemReportRequest) returns (ScheduleMenuItemReportResponse);

  // Streams the changes of menu items as they happen.
  rpc StreamMenuItemMetrics(StreamMenuItemMetricsRequest) returns (stream StreamMenuItemMetricsResponse);

  // Lists menu items a page at a time.
  rpc ListMenuItemReports(ListMenuItemReportsRequest) returns (ListMenuItemReportsResponse);

  // Shares a menu item.
  rpc ShareMenuItemReport(ShareMenuItemReportRequest) returns (ShareMenuItemReportResponse);

  // Counts menu items by status.
  rpc CountMenuItemTotals(CountMenuItemTotalsRequest) returns (CountMenuItemTotalsResponse);
}

// The request of `GenerateMenuItemReport`.
message GenerateMenuItemReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string menu_item_id = 2;
  GenerateMenuItemReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateMenuItemReport`.
message GenerateMenuItemReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchMenuItemReport`.
message FetchMenuItemReportRequest {
  acme.common.v1.RequestContext context = 1;
  string menu_item_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchMenuItemReport`.
message FetchMenuItemReportResponse {
  MenuItem menu_item = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleMenuItemReport`.
message ScheduleMenuItemReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string menu_item_id = 2;
  ScheduleMenuItemReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleMenuItemReport`.
message ScheduleMenuItemReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamMenuItemMetrics`.
message StreamMenuItemMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MenuItemStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamMenuItemMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamMenuItemMetrics`.
message StreamMenuItemMetricsResponse {
  MenuItem menu_item = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListMenuItemReports`.
message ListMenuItemReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MenuItemStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListMenuItemReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListMenuItemReports`.
message ListMenuItemReportsResponse {
  repeated MenuItem menu_items = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareMenuItemReport`.
message ShareMenuItemReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string menu_item_id = 2;
  ShareMenuItemReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareMenuItemReport`.
message ShareMenuItemReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MenuItem menu_item = 1;
  ShareMenuItemReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountMenuItemTotals`.
message CountMenuItemTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MenuItemStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountMenuItemTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountMenuItemTotals`.
message CountMenuItemTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
