syntax = "proto3";

package acme.concessions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/concessions/v1/concessions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Concessions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/concessions/v1;concessionsv1";
option java_multiple_files = true;
option java_outer_classname = "MenuItemValidationServiceProto";
option java_package = "com.acme.concessions.v1";

// Checks menu items against the rules before anything acts on them.
service MenuItemValidationService {
  // Validates a menu item.
  rpc ValidateMenuItem(ValidateMenuItemRequest) returns (ValidateMenuItemResponse);

  // Previews a menu item.
  rpc PreviewMenuItem(PreviewMenuItemRequest) returns (PreviewMenuItemResponse);

  // Checks a menu item.
  rpc CheckMenuItemEligibility(CheckMenuItemEligibilityRequest) returns (CheckMenuItemEligibilityResponse);

  // Explains a menu item.
  rpc ExplainMenuItemDecision(ExplainMenuItemDecisionRequest) returns (ExplainMenuItemDecisionResponse);

  // Scores a menu item.
  rpc ScoreMenuItem(ScoreMenuItemRequest) returns (ScoreMenuItemResponse);

  // Returns a menu item.
  rpc GetMenuItemRules(GetMenuItemRulesRequest) returns (GetMenuItemRulesResponse);
}

// The request of `ValidateMenuItem`.
message ValidateMenuItemRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string menu_item_id = 2;
  MenuItem menu_item = 3;
  ValidateMenuItemRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateMenuItem`.
message ValidateMenuItemResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MenuItem menu_item = 1;
  ValidateMenuItemResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

