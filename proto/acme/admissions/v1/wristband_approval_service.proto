syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "WristbandApprovalServiceProto";
option java_package = "com.acme.admissions.v1";

// Routes wristbands through approval, with escalation and delegation.
service WristbandApprovalService {
  // Submits a wristband.
  rpc SubmitWristband(SubmitWristbandRequest) returns (SubmitWristbandResponse);

  // Approves a wristband.
  rpc ApproveWristband(ApproveWristbandRequest) returns (ApproveWristbandResponse);

  // Rejects a wristband.
  rpc RejectWristband(RejectWristbandRequest) returns (RejectWristbandResponse);

  // Escalates a wristband.
  rpc EscalateWristband(EscalateWristbandRequest) returns (EscalateWristbandResponse);

  // Lists wristbands a page at a time.
  rpc ListPendingWristbands(ListPendingWristbandsRequest) returns (ListPendingWristbandsResponse);

  // Delegates a wristband.
  rpc DelegateWristbandApproval(DelegateWristbandApprovalRequest) returns (DelegateWristbandApprovalResponse);

  // Recalls a wristband.
  rpc RecallWristband(RecallWristbandRequest) returns (RecallWristbandResponse);

  // Returns a wristband.
  rpc GetWristbandApprovalStatus(GetWristbandApprovalStatusRequest) returns (GetWristbandApprovalStatusResponse);

  // Comments a wristband.
  rpc CommentWristbandApproval(CommentWristbandApprovalRequest) returns (CommentWristbandApprovalResponse);
}

// The request of `SubmitWristband`.
message SubmitWristbandRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string wristband_id = 2;
  Wristband wristband = 3;
  SubmitWristbandRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitWristband`.
message SubmitWristbandResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Wristband wristband = 1;
  SubmitWristbandResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

