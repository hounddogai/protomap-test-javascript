syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "GateScanQueryServiceProto";
option java_package = "com.acme.admissions.v1";

// Answers read-only questions about gate scans, for screens and reports.
service GateScanQueryService {
  // Returns a gate scan.
  rpc LookupGateScan(LookupGateScanRequest) returns (LookupGateScanResponse);

  // Lists gate scans a page at a time.
  rpc BrowseGateScans(BrowseGateScansRequest) returns (BrowseGateScansResponse);

  // Lists gate scans a page at a time.
  rpc FindGateScans(FindGateScansRequest) returns (FindGateScansResponse);

  // Counts gate scans by status.
  rpc CountGateScans(CountGateScansRequest) returns (CountGateScansResponse);

  // Returns several gate scans at once.
  rpc ResolveGateScans(ResolveGateScansRequest) returns (ResolveGateScansResponse);

  // Streams every matching gate scan.
  rpc ExportGateScans(ExportGateScansRequest) returns (stream ExportGateScansResponse);

  // Summarizes a gate scan.
  rpc SummarizeGateScans(SummarizeGateScansRequest) returns (SummarizeGateScansResponse);

  // Lists gate scans a page at a time.
  rpc SuggestGateScans(SuggestGateScansRequest) returns (SuggestGateScansResponse);

  // Returns a gate scan.
  rpc PeekGateScan(PeekGateScanRequest) returns (PeekGateScanResponse);
}

// The request of `LookupGateScan`.
message LookupGateScanRequest {
  acme.common.v1.RequestContext context = 1;
  string gate_scan_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupGateScan`.
message LookupGateScanResponse {
  GateScan gate_scan = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseGateScans`.
message BrowseGateScansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GateScanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseGateScansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseGateScans`.
message BrowseGateScansResponse {
  repeated GateScan gate_scans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindGateScans`.
message FindGateScansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GateScanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindGateScansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindGateScans`.
message FindGateScansResponse {
  repeated GateScan gate_scans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountGateScans`.
message CountGateScansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GateScanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountGateScansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountGateScans`.
message CountGateScansResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveGateScans`.
message ResolveGateScansRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string gate_scan_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveGateScans`.
message ResolveGateScansResponse {
  repeated GateScan gate_scans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportGateScans`.
message ExportGateScansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GateScanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportGateScansRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportGateScans`.
message ExportGateScansResponse {
  GateScan gate_scan = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeGateScans`.
message SummarizeGateScansRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gate_scan_id = 2;
  SummarizeGateScansRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeGateScans`.
message SummarizeGateScansResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestGateScans`.
message SuggestGateScansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GateScanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestGateScansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestGateScans`.
message SuggestGateScansResponse {
  repeated GateScan gate_scans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekGateScan`.
message PeekGateScanRequest {
  acme.common.v1.RequestContext context = 1;
  string gate_scan_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekGateScan`.
message PeekGateScanResponse {
  GateScan gate_scan = 1;
  acme.common.v1.OperationResult result = 2;
}
