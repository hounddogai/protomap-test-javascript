syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "GateScanValidationServiceProto";
option java_package = "com.acme.admissions.v1";

// Checks gate scans against the rules before anything acts on them.
service GateScanValidationService {
  // Validates a gate scan.
  rpc ValidateGateScan(ValidateGateScanRequest) returns (ValidateGateScanResponse);

  // Previews a gate scan.
  rpc PreviewGateScan(PreviewGateScanRequest) returns (PreviewGateScanResponse);

  // Checks a gate scan.
  rpc CheckGateScanEligibility(CheckGateScanEligibilityRequest) returns (CheckGateScanEligibilityResponse);

  // Normalizes a gate scan.
  rpc NormalizeGateScan(NormalizeGateScanRequest) returns (NormalizeGateScanResponse);

  // Explains a gate scan.
  rpc ExplainGateScanDecision(ExplainGateScanDecisionRequest) returns (ExplainGateScanDecisionResponse);

  // Scores a gate scan.
  rpc ScoreGateScan(ScoreGateScanRequest) returns (ScoreGateScanResponse);

  // Lints a gate scan.
  rpc LintGateScans(LintGateScansRequest) returns (LintGateScansResponse);

  // Returns a gate scan.
  rpc GetGateScanRules(GetGateScanRulesRequest) returns (GetGateScanRulesResponse);
}

// The request of `ValidateGateScan`.
message ValidateGateScanRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string gate_scan_id = 2;
  GateScan gate_scan = 3;
  ValidateGateScanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateGateScan`.
message ValidateGateScanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GateScan gate_scan = 1;
  ValidateGateScanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

