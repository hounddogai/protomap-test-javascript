syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "WristbandCalculationServiceProto";
option java_package = "com.acme.admissions.v1";

// Computes the figures of a wristband, such as totals, taxes, and estimates.
service WristbandCalculationService {
  // Calculates a wristband.
  rpc CalculateWristband(CalculateWristbandRequest) returns (CalculateWristbandResponse);

  // Estimates a wristband.
  rpc EstimateWristband(EstimateWristbandRequest) returns (EstimateWristbandResponse);

  // Quotes a wristband.
  rpc QuoteWristband(QuoteWristbandRequest) returns (QuoteWristbandResponse);

  // Compares a wristband.
  rpc CompareWristbandOptions(CompareWristbandOptionsRequest) returns (CompareWristbandOptionsResponse);

  // Recalculates a wristband.
  rpc RecalculateWristbands(RecalculateWristbandsRequest) returns (RecalculateWristbandsResponse);

  // Returns a wristband.
  rpc GetWristbandRates(GetWristbandRatesRequest) returns (GetWristbandRatesResponse);
}

// The request of `CalculateWristband`.
message CalculateWristbandRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string wristband_id = 2;
  Wristband wristband = 3;
  CalculateWristbandRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateWristband`.
message CalculateWristbandResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateWristbandResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Wristband wristband = 1;
  CalculateWristbandResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

