syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "AdmissionWorkflowServiceProto";
option java_package = "com.acme.admissions.v1";

// Runs the long-lived workflow that takes an admission from start to finish.
service AdmissionWorkflowService {
  // Starts an admission.
  rpc StartAdmissionWorkflow(StartAdmissionWorkflowRequest) returns (StartAdmissionWorkflowResponse);

  // Advances an admission.
  rpc AdvanceAdmissionWorkflow(AdvanceAdmissionWorkflowRequest) returns (AdvanceAdmissionWorkflowResponse);

  // Cancels an admission.
  rpc CancelAdmissionWorkflow(CancelAdmissionWorkflowRequest) returns (CancelAdmissionWorkflowResponse);

  // Retrys an admission.
  rpc RetryAdmissionWorkflow(RetryAdmissionWorkflowRequest) returns (RetryAdmissionWorkflowResponse);

  // Pauses an admission.
  rpc PauseAdmissionWorkflow(PauseAdmissionWorkflowRequest) returns (PauseAdmissionWorkflowResponse);

  // Resumes an admission.
  rpc ResumeAdmissionWorkflow(ResumeAdmissionWorkflowRequest) returns (ResumeAdmissionWorkflowResponse);

  // Returns an admission.
  rpc InspectAdmissionWorkflow(InspectAdmissionWorkflowRequest) returns (InspectAdmissionWorkflowResponse);

  // Lists admissions a page at a time.
  rpc ListAdmissionWorkflows(ListAdmissionWorkflowsRequest) returns (ListAdmissionWorkflowsResponse);

  // Signals an admission.
  rpc SignalAdmissionWorkflow(SignalAdmissionWorkflowRequest) returns (SignalAdmissionWorkflowResponse);
}

// The request of `StartAdmissionWorkflow`.
message StartAdmissionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string admission_id = 2;
  Admission admission = 3;
  StartAdmissionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAdmissionWorkflow`.
message StartAdmissionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Admission admission = 1;
  StartAdmissionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

