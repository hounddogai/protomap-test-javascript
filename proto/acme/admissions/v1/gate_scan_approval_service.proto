syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "GateScanApprovalServiceProto";
option java_package = "com.acme.admissions.v1";

// Routes gate scans through approval, with escalation and delegation.
service GateScanApprovalService {
  // Submits a gate scan.
  rpc SubmitGateScan(SubmitGateScanRequest) returns (SubmitGateScanResponse);

  // Approves a gate scan.
  rpc ApproveGateScan(ApproveGateScanRequest) returns (ApproveGateScanResponse);

  // Rejects a gate scan.
  rpc RejectGateScan(RejectGateScanRequest) returns (RejectGateScanResponse);

  // Escalates a gate scan.
  rpc EscalateGateScan(EscalateGateScanRequest) returns (EscalateGateScanResponse);

  // Lists gate scans a page at a time.
  rpc ListPendingGateScans(ListPendingGateScansRequest) returns (ListPendingGateScansResponse);

  // Delegates a gate scan.
  rpc DelegateGateScanApproval(DelegateGateScanApprovalRequest) returns (DelegateGateScanApprovalResponse);

  // Recalls a gate scan.
  rpc RecallGateScan(RecallGateScanRequest) returns (RecallGateScanResponse);

  // Returns a gate scan.
  rpc GetGateScanApprovalStatus(GetGateScanApprovalStatusRequest) returns (GetGateScanApprovalStatusResponse);

  // Comments a gate scan.
  rpc CommentGateScanApproval(CommentGateScanApprovalRequest) returns (CommentGateScanApprovalResponse);
}

// The request of `SubmitGateScan`.
message SubmitGateScanRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gate_scan_id = 2;
  GateScan gate_scan = 3;
  SubmitGateScanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitGateScan`.
message SubmitGateScanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GateScan gate_scan = 1;
  SubmitGateScanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

