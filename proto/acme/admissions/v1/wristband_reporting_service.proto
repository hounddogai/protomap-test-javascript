syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "WristbandReportingServiceProto";
option java_package = "com.acme.admissions.v1";

// Builds and schedules reports about wristbands.
service WristbandReportingService {
  // Generates a wristband.
  rpc GenerateWristbandReport(GenerateWristbandReportRequest) returns (GenerateWristbandReportResponse);

  // Returns a wristband.
  rpc FetchWristbandReport(FetchWristbandReportRequest) returns (FetchWristbandReportResponse);

  // Schedules a wristband.
  rpc ScheduleWristbandReport(ScheduleWristbandReportRequest) returns (ScheduleWristbandReportResponse);

  // Streams the changes of wristbands as they happen.
  rpc StreamWristbandMetrics(StreamWristbandMetricsRequest) returns (stream StreamWristbandMetricsResponse);

  // Lists wristbands a page at a time.
  rpc ListWristbandReports(ListWristbandReportsRequest) returns (ListWristbandReportsResponse);

  // Shares a wristband.
  rpc ShareWristbandReport(ShareWristbandReportRequest) returns (ShareWristbandReportResponse);

  // Counts wristbands by status.
  rpc CountWristbandTotals(CountWristbandTotalsRequest) returns (CountWristbandTotalsResponse);

  // Deletes a wristband.
  rpc DeleteWristbandReport(DeleteWristbandReportRequest) returns (DeleteWristbandReportResponse);
}

// The request of `GenerateWristbandReport`.
message GenerateWristbandReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string wristband_id = 2;
  GenerateWristbandReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateWristbandReport`.
message GenerateWristbandReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchWristbandReport`.
message FetchWristbandReportRequest {
  acme.common.v1.RequestContext context = 1;
  string wristband_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchWristbandReport`.
message FetchWristbandReportResponse {
  Wristband wristband = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleWristbandReport`.
message ScheduleWristbandReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string wristband_id = 2;
  ScheduleWristbandReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleWristbandReport`.
message ScheduleWristbandReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamWristbandMetrics`.
message StreamWristbandMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WristbandStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamWristbandMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamWristbandMetrics`.
message StreamWristbandMetricsResponse {
  Wristband wristband = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListWristbandReports`.
message ListWristbandReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WristbandStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListWristbandReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListWristbandReports`.
message ListWristbandReportsResponse {
  repeated Wristband wristbands = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareWristbandReport`.
message ShareWristbandReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string wristband_id = 2;
  ShareWristbandReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareWristbandReport`.
message ShareWristbandReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Wristband wristband = 1;
  ShareWristbandReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountWristbandTotals`.
message CountWristbandTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WristbandStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountWristbandTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountWristbandTotals`.
message CountWristbandTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteWristbandReport`.
message DeleteWristbandReportRequest {
  acme.common.v1.RequestContext context = 1;
  string wristband_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteWristbandReport`.
message DeleteWristbandReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
