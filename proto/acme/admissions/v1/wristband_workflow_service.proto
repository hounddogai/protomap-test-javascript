syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "WristbandWorkflowServiceProto";
option java_package = "com.acme.admissions.v1";

// Runs the long-lived workflow that takes a wristband from start to finish.
service WristbandWorkflowService {
  // Starts a wristband.
  rpc StartWristbandWorkflow(StartWristbandWorkflowRequest) returns (StartWristbandWorkflowResponse);

  // Advances a wristband.
  rpc AdvanceWristbandWorkflow(AdvanceWristbandWorkflowRequest) returns (AdvanceWristbandWorkflowResponse);

  // Cancels a wristband.
  rpc CancelWristbandWorkflow(CancelWristbandWorkflowRequest) returns (CancelWristbandWorkflowResponse);

  // Retrys a wristband.
  rpc RetryWristbandWorkflow(RetryWristbandWorkflowRequest) returns (RetryWristbandWorkflowResponse);

  // Pauses a wristband.
  rpc PauseWristbandWorkflow(PauseWristbandWorkflowRequest) returns (PauseWristbandWorkflowResponse);

  // Resumes a wristband.
  rpc ResumeWristbandWorkflow(ResumeWristbandWorkflowRequest) returns (ResumeWristbandWorkflowResponse);

  // Returns a wristband.
  rpc InspectWristbandWorkflow(InspectWristbandWorkflowRequest) returns (InspectWristbandWorkflowResponse);

  // Lists wristbands a page at a time.
  rpc ListWristbandWorkflows(ListWristbandWorkflowsRequest) returns (ListWristbandWorkflowsResponse);

  // Signals a wristband.
  rpc SignalWristbandWorkflow(SignalWristbandWorkflowRequest) returns (SignalWristbandWorkflowResponse);
}

// The request of `StartWristbandWorkflow`.
message StartWristbandWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string wristband_id = 2;
  Wristband wristband = 3;
  StartWristbandWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartWristbandWorkflow`.
message StartWristbandWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Wristband wristband = 1;
  StartWristbandWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

