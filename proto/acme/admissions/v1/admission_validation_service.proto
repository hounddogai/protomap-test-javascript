syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "AdmissionValidationServiceProto";
option java_package = "com.acme.admissions.v1";

// Checks admissions against the rules before anything acts on them.
service AdmissionValidationService {
  // Validates an admission.
  rpc ValidateAdmission(ValidateAdmissionRequest) returns (ValidateAdmissionResponse);

  // Previews an admission.
  rpc PreviewAdmission(PreviewAdmissionRequest) returns (PreviewAdmissionResponse);

  // Checks an admission.
  rpc CheckAdmissionEligibility(CheckAdmissionEligibilityRequest) returns (CheckAdmissionEligibilityResponse);

  // Normalizes an admission.
  rpc NormalizeAdmission(NormalizeAdmissionRequest) returns (NormalizeAdmissionResponse);

  // Explains an admission.
  rpc ExplainAdmissionDecision(ExplainAdmissionDecisionRequest) returns (ExplainAdmissionDecisionResponse);

  // Scores an admission.
  rpc ScoreAdmission(ScoreAdmissionRequest) returns (ScoreAdmissionResponse);

  // Lints an admission.
  rpc LintAdmissions(LintAdmissionsRequest) returns (LintAdmissionsResponse);

  // Returns an admission.
  rpc GetAdmissionRules(GetAdmissionRulesRequest) returns (GetAdmissionRulesResponse);
}

// The request of `ValidateAdmission`.
message ValidateAdmissionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string admission_id = 2;
  Admission admission = 3;
  ValidateAdmissionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAdmission`.
message ValidateAdmissionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Admission admission = 1;
  ValidateAdmissionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

