syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "WristbandLifecycleServiceProto";
option java_package = "com.acme.admissions.v1";

// Moves a wristband between the states of its lifecycle.
service WristbandLifecycleService {
  // Activates a wristband.
  rpc ActivateWristband(ActivateWristbandRequest) returns (ActivateWristbandResponse);

  // Suspends a wristband.
  rpc SuspendWristband(SuspendWristbandRequest) returns (SuspendWristbandResponse);

  // Reinstates a wristband.
  rpc ReinstateWristband(ReinstateWristbandRequest) returns (ReinstateWristbandResponse);

  // Terminates a wristband.
  rpc TerminateWristband(TerminateWristbandRequest) returns (TerminateWristbandResponse);

  // Renews a wristband.
  rpc RenewWristband(RenewWristbandRequest) returns (RenewWristbandResponse);

  // Expires a wristband.
  rpc ExpireWristband(ExpireWristbandRequest) returns (ExpireWristbandResponse);

  // Returns a wristband.
  rpc GetWristbandLifecycle(GetWristbandLifecycleRequest) returns (GetWristbandLifecycleResponse);

  // Schedules a wristband.
  rpc ScheduleWristbandExpiry(ScheduleWristbandExpiryRequest) returns (ScheduleWristbandExpiryResponse);
}

// The request of `ActivateWristband`.
message ActivateWristbandRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string wristband_id = 2;
  ActivateWristbandRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateWristband`.
message ActivateWristbandResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Wristband wristband = 1;
  ActivateWristbandResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

