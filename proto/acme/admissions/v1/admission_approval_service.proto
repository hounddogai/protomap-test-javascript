syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "AdmissionApprovalServiceProto";
option java_package = "com.acme.admissions.v1";

// Routes admissions through approval, with escalation and delegation.
service AdmissionApprovalService {
  // Submits an admission.
  rpc SubmitAdmission(SubmitAdmissionRequest) returns (SubmitAdmissionResponse);

  // Approves an admission.
  rpc ApproveAdmission(ApproveAdmissionRequest) returns (ApproveAdmissionResponse);

  // Rejects an admission.
  rpc RejectAdmission(RejectAdmissionRequest) returns (RejectAdmissionResponse);

  // Escalates an admission.
  rpc EscalateAdmission(EscalateAdmissionRequest) returns (EscalateAdmissionResponse);

  // Lists admissions a page at a time.
  rpc ListPendingAdmissions(ListPendingAdmissionsRequest) returns (ListPendingAdmissionsResponse);

  // Delegates an admission.
  rpc DelegateAdmissionApproval(DelegateAdmissionApprovalRequest) returns (DelegateAdmissionApprovalResponse);

  // Recalls an admission.
  rpc RecallAdmission(RecallAdmissionRequest) returns (RecallAdmissionResponse);

  // Returns an admission.
  rpc GetAdmissionApprovalStatus(GetAdmissionApprovalStatusRequest) returns (GetAdmissionApprovalStatusResponse);

  // Comments an admission.
  rpc CommentAdmissionApproval(CommentAdmissionApprovalRequest) returns (CommentAdmissionApprovalResponse);
}

// The request of `SubmitAdmission`.
message SubmitAdmissionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string admission_id = 2;
  Admission admission = 3;
  SubmitAdmissionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAdmission`.
message SubmitAdmissionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Admission admission = 1;
  SubmitAdmissionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

