syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "GateScanWorkflowServiceProto";
option java_package = "com.acme.admissions.v1";

// Runs the long-lived workflow that takes a gate scan from start to finish.
service GateScanWorkflowService {
  // Starts a gate scan.
  rpc StartGateScanWorkflow(StartGateScanWorkflowRequest) returns (StartGateScanWorkflowResponse);

  // Advances a gate scan.
  rpc AdvanceGateScanWorkflow(AdvanceGateScanWorkflowRequest) returns (AdvanceGateScanWorkflowResponse);

  // Retrys a gate scan.
  rpc RetryGateScanWorkflow(RetryGateScanWorkflowRequest) returns (RetryGateScanWorkflowResponse);

  // Pauses a gate scan.
  rpc PauseGateScanWorkflow(PauseGateScanWorkflowRequest) returns (PauseGateScanWorkflowResponse);

  // Resumes a gate scan.
  rpc ResumeGateScanWorkflow(ResumeGateScanWorkflowRequest) returns (ResumeGateScanWorkflowResponse);

  // Returns a gate scan.
  rpc InspectGateScanWorkflow(InspectGateScanWorkflowRequest) returns (InspectGateScanWorkflowResponse);

  // Lists gate scans a page at a time.
  rpc ListGateScanWorkflows(ListGateScanWorkflowsRequest) returns (ListGateScanWorkflowsResponse);

  // Signals a gate scan.
  rpc SignalGateScanWorkflow(SignalGateScanWorkflowRequest) returns (SignalGateScanWorkflowResponse);
}

// The request of `StartGateScanWorkflow`.
message StartGateScanWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gate_scan_id = 2;
  GateScan gate_scan = 3;
  StartGateScanWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartGateScanWorkflow`.
message StartGateScanWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GateScan gate_scan = 1;
  StartGateScanWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

