syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "AdmissionLifecycleServiceProto";
option java_package = "com.acme.admissions.v1";

// Moves an admission between the states of its lifecycle.
service AdmissionLifecycleService {
  // Activates an admission.
  rpc ActivateAdmission(ActivateAdmissionRequest) returns (ActivateAdmissionResponse);

  // Suspends an admission.
  rpc SuspendAdmission(SuspendAdmissionRequest) returns (SuspendAdmissionResponse);

  // Reinstates an admission.
  rpc ReinstateAdmission(ReinstateAdmissionRequest) returns (ReinstateAdmissionResponse);

  // Terminates an admission.
  rpc TerminateAdmission(TerminateAdmissionRequest) returns (TerminateAdmissionResponse);

  // Expires an admission.
  rpc ExpireAdmission(ExpireAdmissionRequest) returns (ExpireAdmissionResponse);

  // Returns an admission.
  rpc GetAdmissionLifecycle(GetAdmissionLifecycleRequest) returns (GetAdmissionLifecycleResponse);

  // Schedules an admission.
  rpc ScheduleAdmissionExpiry(ScheduleAdmissionExpiryRequest) returns (ScheduleAdmissionExpiryResponse);
}

// The request of `ActivateAdmission`.
message ActivateAdmissionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string admission_id = 2;
  ActivateAdmissionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateAdmission`.
message ActivateAdmissionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Admission admission = 1;
  ActivateAdmissionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

