syntax = "proto3";

package acme.admissions.v1;

import "acme/admissions/v1/admissions.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Admissions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/admissions/v1;admissionsv1";
option java_multiple_files = true;
option java_outer_classname = "GateScanCalculationServiceProto";
option java_package = "com.acme.admissions.v1";

// Computes the figures of a gate scan, such as totals, taxes, and estimates.
service GateScanCalculationService {
  // Calculates a gate scan.
  rpc CalculateGateScan(CalculateGateScanRequest) returns (CalculateGateScanResponse);

  // Estimates a gate scan.
  rpc EstimateGateScan(EstimateGateScanRequest) returns (EstimateGateScanResponse);

  // Quotes a gate scan.
  rpc QuoteGateScan(QuoteGateScanRequest) returns (QuoteGateScanResponse);

  // Compares a gate scan.
  rpc CompareGateScanOptions(CompareGateScanOptionsRequest) returns (CompareGateScanOptionsResponse);

  // Recalculates a gate scan.
  rpc RecalculateGateScans(RecalculateGateScansRequest) returns (RecalculateGateScansResponse);

  // Simulates a gate scan.
  rpc SimulateGateScan(SimulateGateScanRequest) returns (SimulateGateScanResponse);

  // Explains a gate scan.
  rpc ExplainGateScanCalculation(ExplainGateScanCalculationRequest) returns (ExplainGateScanCalculationResponse);

  // Returns a gate scan.
  rpc GetGateScanRates(GetGateScanRatesRequest) returns (GetGateScanRatesResponse);
}

// The request of `CalculateGateScan`.
message CalculateGateScanRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gate_scan_id = 2;
  GateScan gate_scan = 3;
  CalculateGateScanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateGateScan`.
message CalculateGateScanResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateGateScanResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  GateScan gate_scan = 1;
  CalculateGateScanResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

