syntax = "proto3";

package acme.fanportal.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fanportal/v1/fanportal.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fanportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fanportal/v1;fanportalv1";
option java_multiple_files = true;
option java_outer_classname = "WishlistQueryServiceProto";
option java_package = "com.acme.fanportal.v1";

// Answers read-only questions about wishlists, for screens and reports.
service WishlistQueryService {
  // Returns a wishlist.
  rpc LookupWishlist(LookupWishlistRequest) returns (LookupWishlistResponse);

  // Lists wishlists a page at a time.
  rpc BrowseWishlists(BrowseWishlistsRequest) returns (BrowseWishlistsResponse);

  // Lists wishlists a page at a time.
  rpc FindWishlists(FindWishlistsRequest) returns (FindWishlistsResponse);

  // Counts wishlists by status.
  rpc CountWishlists(CountWishlistsRequest) returns (CountWishlistsResponse);

  // Returns several wishlists at once.
  rpc ResolveWishlists(ResolveWishlistsRequest) returns (ResolveWishlistsResponse);

  // Streams every matching wishlist.
  rpc ExportWishlists(ExportWishlistsRequest) returns (stream ExportWishlistsResponse);

  // Summarizes a wishlist.
  rpc SummarizeWishlists(SummarizeWishlistsRequest) returns (SummarizeWishlistsResponse);
}

// The request of `LookupWishlist`.
message LookupWishlistRequest {
  acme.common.v1.RequestContext context = 1;
  string wishlist_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupWishlist`.
message LookupWishlistResponse {
  Wishlist wishlist = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseWishlists`.
message BrowseWishlistsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WishlistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseWishlistsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseWishlists`.
message BrowseWishlistsResponse {
  repeated Wishlist wishlists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindWishlists`.
message FindWishlistsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WishlistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindWishlistsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindWishlists`.
message FindWishlistsResponse {
  repeated Wishlist wishlists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountWishlists`.
message CountWishlistsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WishlistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountWishlistsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountWishlists`.
message CountWishlistsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveWishlists`.
message ResolveWishlistsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string wishlist_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveWishlists`.
message ResolveWishlistsResponse {
  repeated Wishlist wishlists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportWishlists`.
message ExportWishlistsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WishlistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportWishlistsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportWishlists`.
message ExportWishlistsResponse {
  Wishlist wishlist = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeWishlists`.
message SummarizeWishlistsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string wishlist_id = 2;
  SummarizeWishlistsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeWishlists`.
message SummarizeWishlistsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}
