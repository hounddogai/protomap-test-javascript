syntax = "proto3";

package acme.fanportal.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fanportal/v1/fanportal.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fanportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fanportal/v1;fanportalv1";
option java_multiple_files = true;
option java_outer_classname = "EventPageNotificationServiceProto";
option java_package = "com.acme.fanportal.v1";

// Tells the people who follow an event page what changed.
service EventPageNotificationService {
  // Subscribes an event page.
  rpc SubscribeEventPageUpdates(SubscribeEventPageUpdatesRequest) returns (SubscribeEventPageUpdatesResponse);

  // Unsubscribes an event page.
  rpc UnsubscribeEventPageUpdates(UnsubscribeEventPageUpdatesRequest) returns (UnsubscribeEventPageUpdatesResponse);

  // Notifys an event page.
  rpc NotifyEventPageWatchers(NotifyEventPageWatchersRequest) returns (NotifyEventPageWatchersResponse);

  // Lists event pages a page at a time.
  rpc ListEventPageSubscriptions(ListEventPageSubscriptionsRequest) returns (ListEventPageSubscriptionsResponse);

  // Sends an event page.
  rpc SendEventPageTestNotice(SendEventPageTestNoticeRequest) returns (SendEventPageTestNoticeResponse);

  // Returns an event page.
  rpc GetEventPagePreferences(GetEventPagePreferencesRequest) returns (GetEventPagePreferencesResponse);

  // Streams the changes of event pages as they happen.
  rpc StreamEventPageNotices(StreamEventPageNoticesRequest) returns (stream StreamEventPageNoticesResponse);
}

// The request of `SubscribeEventPageUpdates`.
message SubscribeEventPageUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string event_page_id = 2;
  SubscribeEventPageUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeEventPageUpdates`.
message SubscribeEventPageUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EventPage event_page = 1;
  SubscribeEventPageUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeEventPageUpdates`.
message UnsubscribeEventPageUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string event_page_id = 2;
  UnsubscribeEventPageUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeEventPageUpdates`.
message UnsubscribeEventPageUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EventPage event_page = 1;
  UnsubscribeEventPageUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyEventPageWatchers`.
message NotifyEventPageWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string event_page_id = 2;
  NotifyEventPageWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyEventPageWatchers`.
message NotifyEventPageWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EventPage event_page = 1;
  NotifyEventPageWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListEventPageSubscriptions`.
message ListEventPageSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EventPageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListEventPageSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListEventPageSubscriptions`.
message ListEventPageSubscriptionsResponse {
  repeated EventPage event_pages = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendEventPageTestNotice`.
message SendEventPageTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
