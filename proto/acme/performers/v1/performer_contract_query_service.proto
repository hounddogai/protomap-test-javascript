syntax = "proto3";

package acme.performers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/performers/v1/performers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performers/v1;performersv1";
option java_multiple_files = true;
option java_outer_classname = "PerformerContractQueryServiceProto";
option java_package = "com.acme.performers.v1";

// Answers read-only questions about performer contracts, for screens and reports.
service PerformerContractQueryService {
  // Returns a performer contract.
  rpc LookupPerformerContract(LookupPerformerContractRequest) returns (LookupPerformerContractResponse);

  // Lists performer contracts a page at a time.
  rpc BrowsePerformerContracts(BrowsePerformerContractsRequest) returns (BrowsePerformerContractsResponse);

  // Lists performer contracts a page at a time.
  rpc FindPerformerContracts(FindPerformerContractsRequest) returns (FindPerformerContractsResponse);

  // Returns several performer contracts at once.
  rpc ResolvePerformerContracts(ResolvePerformerContractsRequest) returns (ResolvePerformerContractsResponse);

  // Streams every matching performer contract.
  rpc ExportPerformerContracts(ExportPerformerContractsRequest) returns (stream ExportPerformerContractsResponse);

  // Summarizes a performer contract.
  rpc SummarizePerformerContracts(SummarizePerformerContractsRequest) returns (SummarizePerformerContractsResponse);
}

// The request of `LookupPerformerContract`.
message LookupPerformerContractRequest {
  acme.common.v1.RequestContext context = 1;
  string performer_contract_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPerformerContract`.
message LookupPerformerContractResponse {
  PerformerContract performer_contract = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePerformerContracts`.
message BrowsePerformerContractsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PerformerContractStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePerformerContractsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePerformerContracts`.
message BrowsePerformerContractsResponse {
  repeated PerformerContract performer_contracts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPerformerContracts`.
message FindPerformerContractsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PerformerContractStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPerformerContractsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPerformerContracts`.
message FindPerformerContractsResponse {
  repeated PerformerContract performer_contracts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePerformerContracts`.
message ResolvePerformerContractsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string performer_contract_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePerformerContracts`.
message ResolvePerformerContractsResponse {
  repeated PerformerContract performer_contracts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPerformerContracts`.
message ExportPerformerContractsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PerformerContractStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPerformerContractsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPerformerContracts`.
message ExportPerformerContractsResponse {
  PerformerContract performer_contract = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePerformerContracts`.
message SummarizePerformerContractsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string performer_contract_id = 2;
  SummarizePerformerContractsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePerformerContracts`.
message SummarizePerformerContractsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}
