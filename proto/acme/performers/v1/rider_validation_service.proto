syntax = "proto3";

package acme.performers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/performers/v1/performers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performers/v1;performersv1";
option java_multiple_files = true;
option java_outer_classname = "RiderValidationServiceProto";
option java_package = "com.acme.performers.v1";

// Checks riders against the rules before anything acts on them.
service RiderValidationService {
  // Validates a rider.
  rpc ValidateRider(ValidateRiderRequest) returns (ValidateRiderResponse);

  // Previews a rider.
  rpc PreviewRider(PreviewRiderRequest) returns (PreviewRiderResponse);

  // Normalizes a rider.
  rpc NormalizeRider(NormalizeRiderRequest) returns (NormalizeRiderResponse);

  // Scores a rider.
  rpc ScoreRider(ScoreRiderRequest) returns (ScoreRiderResponse);

  // Lints a rider.
  rpc LintRiders(LintRidersRequest) returns (LintRidersResponse);

  // Returns a rider.
  rpc GetRiderRules(GetRiderRulesRequest) returns (GetRiderRulesResponse);
}

// The request of `ValidateRider`.
message ValidateRiderRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string rider_id = 2;
  Rider rider = 3;
  ValidateRiderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRider`.
message ValidateRiderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rider rider = 1;
  ValidateRiderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewRider`.
message PreviewRiderRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string rider_id = 2;
  Rider rider = 3;
  PreviewRiderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PreviewRider`.
message PreviewRiderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rider rider = 1;
  PreviewRiderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NormalizeRider`.
message NormalizeRiderRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string rider_id = 2;
  Rider rider = 3;
  NormalizeRiderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `NormalizeRider`.
message NormalizeRiderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rider rider = 1;
  NormalizeRiderResponse.Outcome outcome = 2;
