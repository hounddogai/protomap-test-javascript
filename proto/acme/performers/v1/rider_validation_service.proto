}

// The request of `GetRiderRules`.
message GetRiderRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string rider_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRiderRules`.
message GetRiderRulesResponse {
  Rider rider = 1;
  acme.common.v1.OperationResult result = 2;
}
