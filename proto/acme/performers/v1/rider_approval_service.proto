syntax = "proto3";

package acme.performers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/performers/v1/performers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performers/v1;performersv1";
option java_multiple_files = true;
option java_outer_classname = "RiderApprovalServiceProto";
option java_package = "com.acme.performers.v1";

// Routes riders through approval, with escalation and delegation.
service RiderApprovalService {
  // Submits a rider.
  rpc SubmitRider(SubmitRiderRequest) returns (SubmitRiderResponse);

  // Approves a rider.
  rpc ApproveRider(ApproveRiderRequest) returns (ApproveRiderResponse);

  // Escalates a rider.
  rpc EscalateRider(EscalateRiderRequest) returns (EscalateRiderResponse);

  // Lists riders a page at a time.
  rpc ListPendingRiders(ListPendingRidersRequest) returns (ListPendingRidersResponse);

  // Delegates a rider.
  rpc DelegateRiderApproval(DelegateRiderApprovalRequest) returns (DelegateRiderApprovalResponse);

  // Recalls a rider.
  rpc RecallRider(RecallRiderRequest) returns (RecallRiderResponse);

  // Returns a rider.
  rpc GetRiderApprovalStatus(GetRiderApprovalStatusRequest) returns (GetRiderApprovalStatusResponse);

  // Comments a rider.
  rpc CommentRiderApproval(CommentRiderApprovalRequest) returns (CommentRiderApprovalResponse);
}

// The request of `SubmitRider`.
message SubmitRiderRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rider_id = 2;
  Rider rider = 3;
  SubmitRiderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRider`.
message SubmitRiderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rider rider = 1;
  SubmitRiderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

