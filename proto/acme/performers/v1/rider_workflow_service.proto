syntax = "proto3";

package acme.performers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/performers/v1/performers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performers/v1;performersv1";
option java_multiple_files = true;
option java_outer_classname = "RiderWorkflowServiceProto";
option java_package = "com.acme.performers.v1";

// Runs the long-lived workflow that takes a rider from start to finish.
service RiderWorkflowService {
  // Starts a rider.
  rpc StartRiderWorkflow(StartRiderWorkflowRequest) returns (StartRiderWorkflowResponse);

  // Advances a rider.
  rpc AdvanceRiderWorkflow(AdvanceRiderWorkflowRequest) returns (AdvanceRiderWorkflowResponse);

  // Cancels a rider.
  rpc CancelRiderWorkflow(CancelRiderWorkflowRequest) returns (CancelRiderWorkflowResponse);

  // Retrys a rider.
  rpc RetryRiderWorkflow(RetryRiderWorkflowRequest) returns (RetryRiderWorkflowResponse);

  // Pauses a rider.
  rpc PauseRiderWorkflow(PauseRiderWorkflowRequest) returns (PauseRiderWorkflowResponse);

  // Returns a rider.
  rpc InspectRiderWorkflow(InspectRiderWorkflowRequest) returns (InspectRiderWorkflowResponse);

  // Lists riders a page at a time.
  rpc ListRiderWorkflows(ListRiderWorkflowsRequest) returns (ListRiderWorkflowsResponse);

  // Signals a rider.
  rpc SignalRiderWorkflow(SignalRiderWorkflowRequest) returns (SignalRiderWorkflowResponse);
}

// The request of `StartRiderWorkflow`.
message StartRiderWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rider_id = 2;
  Rider rider = 3;
  StartRiderWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRiderWorkflow`.
message StartRiderWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rider rider = 1;
  StartRiderWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

