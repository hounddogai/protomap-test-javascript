syntax = "proto3";

package acme.performers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/performers/v1/performers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performers/v1;performersv1";
option java_multiple_files = true;
option java_outer_classname = "PerformerContractWorkflowServiceProto";
option java_package = "com.acme.performers.v1";

// Runs the long-lived workflow that takes a performer contract from start to finish.
service PerformerContractWorkflowService {
  // Starts a performer contract.
  rpc StartPerformerContractWorkflow(StartPerformerContractWorkflowRequest) returns (StartPerformerContractWorkflowResponse);

  // Advances a performer contract.
  rpc AdvancePerformerContractWorkflow(AdvancePerformerContractWorkflowRequest) returns (AdvancePerformerContractWorkflowResponse);

  // Cancels a performer contract.
  rpc CancelPerformerContractWorkflow(CancelPerformerContractWorkflowRequest) returns (CancelPerformerContractWorkflowResponse);

  // Retrys a performer contract.
  rpc RetryPerformerContractWorkflow(RetryPerformerContractWorkflowRequest) returns (RetryPerformerContractWorkflowResponse);

  // Pauses a performer contract.
  rpc PausePerformerContractWorkflow(PausePerformerContractWorkflowRequest) returns (PausePerformerContractWorkflowResponse);

  // Resumes a performer contract.
  rpc ResumePerformerContractWorkflow(ResumePerformerContractWorkflowRequest) returns (ResumePerformerContractWorkflowResponse);

  // Returns a performer contract.
  rpc InspectPerformerContractWorkflow(InspectPerformerContractWorkflowRequest) returns (InspectPerformerContractWorkflowResponse);

  // Lists performer contracts a page at a time.
  rpc ListPerformerContractWorkflows(ListPerformerContractWorkflowsRequest) returns (ListPerformerContractWorkflowsResponse);

  // Signals a performer contract.
  rpc SignalPerformerContractWorkflow(SignalPerformerContractWorkflowRequest) returns (SignalPerformerContractWorkflowResponse);
}

// The request of `StartPerformerContractWorkflow`.
message StartPerformerContractWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string performer_contract_id = 2;
  PerformerContract performer_contract = 3;
  StartPerformerContractWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPerformerContractWorkflow`.
message StartPerformerContractWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PerformerContract performer_contract = 1;
  StartPerformerContractWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

