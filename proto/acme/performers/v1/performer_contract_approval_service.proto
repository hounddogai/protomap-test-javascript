syntax = "proto3";

package acme.performers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/performers/v1/performers.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performers/v1;performersv1";
option java_multiple_files = true;
option java_outer_classname = "PerformerContractApprovalServiceProto";
option java_package = "com.acme.performers.v1";

// Routes performer contracts through approval, with escalation and delegation.
service PerformerContractApprovalService {
  // Submits a performer contract.
  rpc SubmitPerformerContract(SubmitPerformerContractRequest) returns (SubmitPerformerContractResponse);

  // Approves a performer contract.
  rpc ApprovePerformerContract(ApprovePerformerContractRequest) returns (ApprovePerformerContractResponse);

  // Rejects a performer contract.
  rpc RejectPerformerContract(RejectPerformerContractRequest) returns (RejectPerformerContractResponse);

  // Escalates a performer contract.
  rpc EscalatePerformerContract(EscalatePerformerContractRequest) returns (EscalatePerformerContractResponse);

  // Lists performer contracts a page at a time.
  rpc ListPendingPerformerContracts(ListPendingPerformerContractsRequest) returns (ListPendingPerformerContractsResponse);

  // Recalls a performer contract.
  rpc RecallPerformerContract(RecallPerformerContractRequest) returns (RecallPerformerContractResponse);

  // Comments a performer contract.
  rpc CommentPerformerContractApproval(CommentPerformerContractApprovalRequest) returns (CommentPerformerContractApprovalResponse);
}

// The request of `SubmitPerformerContract`.
message SubmitPerformerContractRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string performer_contract_id = 2;
  PerformerContract performer_contract = 3;
  SubmitPerformerContractRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPerformerContract`.
message SubmitPerformerContractResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PerformerContract performer_contract = 1;
  SubmitPerformerContractResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

