syntax = "proto3";

package acme.performers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/performers/v1/performers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performers/v1;performersv1";
option java_multiple_files = true;
option java_outer_classname = "PerformerApprovalServiceProto";
option java_package = "com.acme.performers.v1";

// Routes performers through approval, with escalation and delegation.
service PerformerApprovalService {
  // Submits a performer.
  rpc SubmitPerformer(SubmitPerformerRequest) returns (SubmitPerformerResponse);

  // Approves a performer.
  rpc ApprovePerformer(ApprovePerformerRequest) returns (ApprovePerformerResponse);

  // Rejects a performer.
  rpc RejectPerformer(RejectPerformerRequest) returns (RejectPerformerResponse);

  // Escalates a performer.
  rpc EscalatePerformer(EscalatePerformerRequest) returns (EscalatePerformerResponse);

  // Delegates a performer.
  rpc DelegatePerformerApproval(DelegatePerformerApprovalRequest) returns (DelegatePerformerApprovalResponse);

  // Recalls a performer.
  rpc RecallPerformer(RecallPerformerRequest) returns (RecallPerformerResponse);

  // Returns a performer.
  rpc GetPerformerApprovalStatus(GetPerformerApprovalStatusRequest) returns (GetPerformerApprovalStatusResponse);

  // Comments a performer.
  rpc CommentPerformerApproval(CommentPerformerApprovalRequest) returns (CommentPerformerApprovalResponse);
}

// The request of `SubmitPerformer`.
message SubmitPerformerRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string performer_id = 2;
  Performer performer = 3;
  SubmitPerformerRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPerformer`.
message SubmitPerformerResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Performer performer = 1;
  SubmitPerformerResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

