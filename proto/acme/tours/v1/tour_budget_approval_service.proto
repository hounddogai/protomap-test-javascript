syntax = "proto3";

package acme.tours.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/tours/v1/tours.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Tours.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/tours/v1;toursv1";
option java_multiple_files = true;
option java_outer_classname = "TourBudgetApprovalServiceProto";
option java_package = "com.acme.tours.v1";

// Routes tour budgets through approval, with escalation and delegation.
service TourBudgetApprovalService {
  // Submits a tour budget.
  rpc SubmitTourBudget(SubmitTourBudgetRequest) returns (SubmitTourBudgetResponse);

  // Approves a tour budget.
  rpc ApproveTourBudget(ApproveTourBudgetRequest) returns (ApproveTourBudgetResponse);

  // Rejects a tour budget.
  rpc RejectTourBudget(RejectTourBudgetRequest) returns (RejectTourBudgetResponse);

  // Escalates a tour budget.
  rpc EscalateTourBudget(EscalateTourBudgetRequest) returns (EscalateTourBudgetResponse);

  // Lists tour budgets a page at a time.
  rpc ListPendingTourBudgets(ListPendingTourBudgetsRequest) returns (ListPendingTourBudgetsResponse);

  // Delegates a tour budget.
  rpc DelegateTourBudgetApproval(DelegateTourBudgetApprovalRequest) returns (DelegateTourBudgetApprovalResponse);

  // Recalls a tour budget.
  rpc RecallTourBudget(RecallTourBudgetRequest) returns (RecallTourBudgetResponse);

  // Returns a tour budget.
  rpc GetTourBudgetApprovalStatus(GetTourBudgetApprovalStatusRequest) returns (GetTourBudgetApprovalStatusResponse);

  // Comments a tour budget.
  rpc CommentTourBudgetApproval(CommentTourBudgetApprovalRequest) returns (CommentTourBudgetApprovalResponse);
}

// The request of `SubmitTourBudget`.
message SubmitTourBudgetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tour_budget_id = 2;
  TourBudget tour_budget = 3;
  SubmitTourBudgetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTourBudget`.
message SubmitTourBudgetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TourBudget tour_budget = 1;
  SubmitTourBudgetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

