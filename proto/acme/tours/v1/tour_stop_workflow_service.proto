option csharp_namespace = "Acme.Tours.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/tours/v1;toursv1";
option java_multiple_files = true;
option java_outer_classname = "TourStopWorkflowServiceProto";
option java_package = "com.acme.tours.v1";

// Runs the long-lived workflow that takes a tour stop from start to finish.
service TourStopWorkflowService {
  // Starts a tour stop.
  rpc StartTourStopWorkflow(StartTourStopWorkflowRequest) returns (StartTourStopWorkflowResponse);

  // Advances a tour stop.
  rpc AdvanceTourStopWorkflow(AdvanceTourStopWorkflowRequest) returns (AdvanceTourStopWorkflowResponse);

  // Cancels a tour stop.
  rpc CancelTourStopWorkflow(CancelTourStopWorkflowRequest) returns (CancelTourStopWorkflowResponse);

  // Retrys a tour stop.
  rpc RetryTourStopWorkflow(RetryTourStopWorkflowRequest) returns (RetryTourStopWorkflowResponse);

  // Pauses a tour stop.
  rpc PauseTourStopWorkflow(PauseTourStopWorkflowRequest) returns (PauseTourStopWorkflowResponse);

  // Resumes a tour stop.
  rpc ResumeTourStopWorkflow(ResumeTourStopWorkflowRequest) returns (ResumeTourStopWorkflowResponse);

  // Returns a tour stop.
  rpc InspectTourStopWorkflow(InspectTourStopWorkflowRequest) returns (InspectTourStopWorkflowResponse);

  // Lists tour stops a page at a time.
  rpc ListTourStopWorkflows(ListTourStopWorkflowsRequest) returns (ListTourStopWorkflowsResponse);

  // Signals a tour stop.
  rpc SignalTourStopWorkflow(SignalTourStopWorkflowRequest) returns (SignalTourStopWorkflowResponse);
}

// The request of `StartTourStopWorkflow`.
message StartTourStopWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tour_stop_id = 2;
  TourStop tour_stop = 3;
  StartTourStopWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTourStopWorkflow`.
message StartTourStopWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TourStop tour_stop = 1;
  StartTourStopWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

