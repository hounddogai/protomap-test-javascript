syntax = "proto3";

package acme.tours.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/tours/v1/tours.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Tours.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/tours/v1;toursv1";
option java_multiple_files = true;
option java_outer_classname = "TourBudgetValidationServiceProto";
option java_package = "com.acme.tours.v1";

// Checks tour budgets against the rules before anything acts on them.
service TourBudgetValidationService {
  // Validates a tour budget.
  rpc ValidateTourBudget(ValidateTourBudgetRequest) returns (ValidateTourBudgetResponse);

  // Previews a tour budget.
  rpc PreviewTourBudget(PreviewTourBudgetRequest) returns (PreviewTourBudgetResponse);

  // Checks a tour budget.
  rpc CheckTourBudgetEligibility(CheckTourBudgetEligibilityRequest) returns (CheckTourBudgetEligibilityResponse);

  // Normalizes a tour budget.
  rpc NormalizeTourBudget(NormalizeTourBudgetRequest) returns (NormalizeTourBudgetResponse);

  // Explains a tour budget.
  rpc ExplainTourBudgetDecision(ExplainTourBudgetDecisionRequest) returns (ExplainTourBudgetDecisionResponse);

  // Scores a tour budget.
  rpc ScoreTourBudget(ScoreTourBudgetRequest) returns (ScoreTourBudgetResponse);

  // Lints a tour budget.
  rpc LintTourBudgets(LintTourBudgetsRequest) returns (LintTourBudgetsResponse);

  // Returns a tour budget.
  rpc GetTourBudgetRules(GetTourBudgetRulesRequest) returns (GetTourBudgetRulesResponse);
}

// The request of `ValidateTourBudget`.
message ValidateTourBudgetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tour_budget_id = 2;
  TourBudget tour_budget = 3;
  ValidateTourBudgetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTourBudget`.
message ValidateTourBudgetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TourBudget tour_budget = 1;
  ValidateTourBudgetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

