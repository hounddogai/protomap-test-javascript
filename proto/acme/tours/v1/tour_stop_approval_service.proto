syntax = "proto3";

package acme.tours.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/tours/v1/tours.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Tours.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/tours/v1;toursv1";
option java_multiple_files = true;
option java_outer_classname = "TourStopApprovalServiceProto";
option java_package = "com.acme.tours.v1";

// Routes tour stops through approval, with escalation and delegation.
service TourStopApprovalService {
  // Submits a tour stop.
  rpc SubmitTourStop(SubmitTourStopRequest) returns (SubmitTourStopResponse);

  // Approves a tour stop.
  rpc ApproveTourStop(ApproveTourStopRequest) returns (ApproveTourStopResponse);

  // Rejects a tour stop.
  rpc RejectTourStop(RejectTourStopRequest) returns (RejectTourStopResponse);

  // Escalates a tour stop.
  rpc EscalateTourStop(EscalateTourStopRequest) returns (EscalateTourStopResponse);

  // Lists tour stops a page at a time.
  rpc ListPendingTourStops(ListPendingTourStopsRequest) returns (ListPendingTourStopsResponse);

  // Delegates a tour stop.
  rpc DelegateTourStopApproval(DelegateTourStopApprovalRequest) returns (DelegateTourStopApprovalResponse);

  // Recalls a tour stop.
  rpc RecallTourStop(RecallTourStopRequest) returns (RecallTourStopResponse);

  // Returns a tour stop.
  rpc GetTourStopApprovalStatus(GetTourStopApprovalStatusRequest) returns (GetTourStopApprovalStatusResponse);
}

// The request of `SubmitTourStop`.
message SubmitTourStopRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tour_stop_id = 2;
  TourStop tour_stop = 3;
  SubmitTourStopRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTourStop`.
message SubmitTourStopResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TourStop tour_stop = 1;
  SubmitTourStopResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

