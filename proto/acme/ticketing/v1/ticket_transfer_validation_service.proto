syntax = "proto3";

package acme.ticketing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/ticketing/v1/ticketing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ticketing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ticketing/v1;ticketingv1";
option java_multiple_files = true;
option java_outer_classname = "TicketTransferValidationServiceProto";
option java_package = "com.acme.ticketing.v1";

// Checks ticket transfers against the rules before anything acts on them.
service TicketTransferValidationService {
  // Validates a ticket transfer.
  rpc ValidateTicketTransfer(ValidateTicketTransferRequest) returns (ValidateTicketTransferResponse);

  // Previews a ticket transfer.
  rpc PreviewTicketTransfer(PreviewTicketTransferRequest) returns (PreviewTicketTransferResponse);

  // Checks a ticket transfer.
  rpc CheckTicketTransferEligibility(CheckTicketTransferEligibilityRequest) returns (CheckTicketTransferEligibilityResponse);

  // Normalizes a ticket transfer.
  rpc NormalizeTicketTransfer(NormalizeTicketTransferRequest) returns (NormalizeTicketTransferResponse);

  // Explains a ticket transfer.
  rpc ExplainTicketTransferDecision(ExplainTicketTransferDecisionRequest) returns (ExplainTicketTransferDecisionResponse);

  // Scores a ticket transfer.
  rpc ScoreTicketTransfer(ScoreTicketTransferRequest) returns (ScoreTicketTransferResponse);

  // Lints a ticket transfer.
  rpc LintTicketTransfers(LintTicketTransfersRequest) returns (LintTicketTransfersResponse);

  // Returns a ticket transfer.
  rpc GetTicketTransferRules(GetTicketTransferRulesRequest) returns (GetTicketTransferRulesResponse);
}

// The request of `ValidateTicketTransfer`.
message ValidateTicketTransferRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string ticket_transfer_id = 2;
  TicketTransfer ticket_transfer = 3;
  ValidateTicketTransferRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTicketTransfer`.
message ValidateTicketTransferResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TicketTransfer ticket_transfer = 1;
  ValidateTicketTransferResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

