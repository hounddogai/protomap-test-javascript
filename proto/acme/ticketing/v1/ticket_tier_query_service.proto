syntax = "proto3";

package acme.ticketing.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ticketing/v1/ticketing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ticketing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ticketing/v1;ticketingv1";
option java_multiple_files = true;
option java_outer_classname = "TicketTierQueryServiceProto";
option java_package = "com.acme.ticketing.v1";

// Answers read-only questions about ticket tiers, for screens and reports.
service TicketTierQueryService {
  // Returns a ticket tier.
  rpc LookupTicketTier(LookupTicketTierRequest) returns (LookupTicketTierResponse);

  // Lists ticket tiers a page at a time.
  rpc BrowseTicketTiers(BrowseTicketTiersRequest) returns (BrowseTicketTiersResponse);

  // Lists ticket tiers a page at a time.
  rpc FindTicketTiers(FindTicketTiersRequest) returns (FindTicketTiersResponse);

  // Counts ticket tiers by status.
  rpc CountTicketTiers(CountTicketTiersRequest) returns (CountTicketTiersResponse);

  // Returns several ticket tiers at once.
  rpc ResolveTicketTiers(ResolveTicketTiersRequest) returns (ResolveTicketTiersResponse);

  // Streams every matching ticket tier.
  rpc ExportTicketTiers(ExportTicketTiersRequest) returns (stream ExportTicketTiersResponse);

  // Summarizes a ticket tier.
  rpc SummarizeTicketTiers(SummarizeTicketTiersRequest) returns (SummarizeTicketTiersResponse);

  // Lists ticket tiers a page at a time.
  rpc SuggestTicketTiers(SuggestTicketTiersRequest) returns (SuggestTicketTiersResponse);

  // Returns a ticket tier.
  rpc PeekTicketTier(PeekTicketTierRequest) returns (PeekTicketTierResponse);
}

// The request of `LookupTicketTier`.
message LookupTicketTierRequest {
  acme.common.v1.RequestContext context = 1;
  string ticket_tier_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupTicketTier`.
message LookupTicketTierResponse {
  TicketTier ticket_tier = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseTicketTiers`.
message BrowseTicketTiersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TicketTierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseTicketTiersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseTicketTiers`.
message BrowseTicketTiersResponse {
  repeated TicketTier ticket_tiers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindTicketTiers`.
message FindTicketTiersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TicketTierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindTicketTiersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindTicketTiers`.
message FindTicketTiersResponse {
  repeated TicketTier ticket_tiers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountTicketTiers`.
message CountTicketTiersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TicketTierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountTicketTiersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountTicketTiers`.
message CountTicketTiersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveTicketTiers`.
message ResolveTicketTiersRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string ticket_tier_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveTicketTiers`.
message ResolveTicketTiersResponse {
  repeated TicketTier ticket_tiers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportTicketTiers`.
message ExportTicketTiersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TicketTierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportTicketTiersRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportTicketTiers`.
message ExportTicketTiersResponse {
  TicketTier ticket_tier = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeTicketTiers`.
message SummarizeTicketTiersRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string ticket_tier_id = 2;
  SummarizeTicketTiersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeTicketTiers`.
message SummarizeTicketTiersResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestTicketTiers`.
message SuggestTicketTiersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TicketTierStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestTicketTiersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestTicketTiers`.
message SuggestTicketTiersResponse {
  repeated TicketTier ticket_tiers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekTicketTier`.
message PeekTicketTierRequest {
  acme.common.v1.RequestContext context = 1;
  string ticket_tier_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekTicketTier`.
message PeekTicketTierResponse {
  TicketTier ticket_tier = 1;
  acme.common.v1.OperationResult result = 2;
}
