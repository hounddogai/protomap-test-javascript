syntax = "proto3";

package acme.ticketing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/ticketing/v1/ticketing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ticketing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ticketing/v1;ticketingv1";
option java_multiple_files = true;
option java_outer_classname = "TicketTierApprovalServiceProto";
option java_package = "com.acme.ticketing.v1";

// Routes ticket tiers through approval, with escalation and delegation.
service TicketTierApprovalService {
  // Submits a ticket tier.
  rpc SubmitTicketTier(SubmitTicketTierRequest) returns (SubmitTicketTierResponse);

  // Approves a ticket tier.
  rpc ApproveTicketTier(ApproveTicketTierRequest) returns (ApproveTicketTierResponse);

  // Rejects a ticket tier.
  rpc RejectTicketTier(RejectTicketTierRequest) returns (RejectTicketTierResponse);

  // Delegates a ticket tier.
  rpc DelegateTicketTierApproval(DelegateTicketTierApprovalRequest) returns (DelegateTicketTierApprovalResponse);

  // Recalls a ticket tier.
  rpc RecallTicketTier(RecallTicketTierRequest) returns (RecallTicketTierResponse);

  // Returns a ticket tier.
  rpc GetTicketTierApprovalStatus(GetTicketTierApprovalStatusRequest) returns (GetTicketTierApprovalStatusResponse);

  // Comments a ticket tier.
  rpc CommentTicketTierApproval(CommentTicketTierApprovalRequest) returns (CommentTicketTierApprovalResponse);
}

// The request of `SubmitTicketTier`.
message SubmitTicketTierRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string ticket_tier_id = 2;
  TicketTier ticket_tier = 3;
  SubmitTicketTierRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTicketTier`.
message SubmitTicketTierResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TicketTier ticket_tier = 1;
  SubmitTicketTierResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

