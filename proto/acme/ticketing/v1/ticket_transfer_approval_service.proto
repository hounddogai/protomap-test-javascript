syntax = "proto3";

package acme.ticketing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/ticketing/v1/ticketing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ticketing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ticketing/v1;ticketingv1";
option java_multiple_files = true;
option java_outer_classname = "TicketTransferApprovalServiceProto";
option java_package = "com.acme.ticketing.v1";

// Routes ticket transfers through approval, with escalation and delegation.
service TicketTransferApprovalService {
  // Submits a ticket transfer.
  rpc SubmitTicketTransfer(SubmitTicketTransferRequest) returns (SubmitTicketTransferResponse);

  // Approves a ticket transfer.
  rpc ApproveTicketTransfer(ApproveTicketTransferRequest) returns (ApproveTicketTransferResponse);

  // Rejects a ticket transfer.
  rpc RejectTicketTransfer(RejectTicketTransferRequest) returns (RejectTicketTransferResponse);

  // Escalates a ticket transfer.
  rpc EscalateTicketTransfer(EscalateTicketTransferRequest) returns (EscalateTicketTransferResponse);

  // Lists ticket transfers a page at a time.
  rpc ListPendingTicketTransfers(ListPendingTicketTransfersRequest) returns (ListPendingTicketTransfersResponse);

  // Delegates a ticket transfer.
  rpc DelegateTicketTransferApproval(DelegateTicketTransferApprovalRequest) returns (DelegateTicketTransferApprovalResponse);

  // Recalls a ticket transfer.
  rpc RecallTicketTransfer(RecallTicketTransferRequest) returns (RecallTicketTransferResponse);

  // Returns a ticket transfer.
  rpc GetTicketTransferApprovalStatus(GetTicketTransferApprovalStatusRequest) returns (GetTicketTransferApprovalStatusResponse);

  // Comments a ticket transfer.
  rpc CommentTicketTransferApproval(CommentTicketTransferApprovalRequest) returns (CommentTicketTransferApprovalResponse);
}

// The request of `SubmitTicketTransfer`.
message SubmitTicketTransferRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string ticket_transfer_id = 2;
  TicketTransfer ticket_transfer = 3;
  SubmitTicketTransferRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTicketTransfer`.
message SubmitTicketTransferResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TicketTransfer ticket_transfer = 1;
  SubmitTicketTransferResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

