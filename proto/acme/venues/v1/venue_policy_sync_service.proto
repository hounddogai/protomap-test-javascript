syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/venues/v1/venues.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenuePolicySyncServiceProto";
option java_package = "com.acme.venues.v1";

// Keeps venue policies in step with the systems of record in other regions.
service VenuePolicySyncService {
  // Syncs a venue policy.
  rpc SyncVenuePolicies(SyncVenuePoliciesRequest) returns (SyncVenuePoliciesResponse);

  // Pushs a venue policy.
  rpc PushVenuePolicy(PushVenuePolicyRequest) returns (PushVenuePolicyResponse);

  // Reconciles a venue policy.
  rpc ReconcileVenuePolicies(ReconcileVenuePoliciesRequest) returns (ReconcileVenuePoliciesResponse);

  // Exchanges changes of venue policies with a peer.
  rpc StreamVenuePolicyChanges(stream StreamVenuePolicyChangesRequest) returns (stream StreamVenuePolicyChangesResponse);

  // Resolves a venue policy.
  rpc ResolveVenuePolicyConflict(ResolveVenuePolicyConflictRequest) returns (ResolveVenuePolicyConflictResponse);

  // Lists venue policies a page at a time.
  rpc ListVenuePolicyConflicts(ListVenuePolicyConflictsRequest) returns (ListVenuePolicyConflictsResponse);
}

// The request of `SyncVenuePolicies`.
message SyncVenuePoliciesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  VenuePolicy venue_policy = 3;
  SyncVenuePoliciesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncVenuePolicies`.
message SyncVenuePoliciesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenuePolicy venue_policy = 1;
  SyncVenuePoliciesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushVenuePolicy`.
message PushVenuePolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  VenuePolicy venue_policy = 3;
  PushVenuePolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushVenuePolicy`.
message PushVenuePolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenuePolicy venue_policy = 1;
  PushVenuePolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileVenuePolicies`.
message ReconcileVenuePoliciesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  VenuePolicy venue_policy = 3;
  ReconcileVenuePoliciesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcileVenuePolicies`.
message ReconcileVenuePoliciesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenuePolicy venue_policy = 1;
  ReconcileVenuePoliciesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `StreamVenuePolicyChanges`.
message StreamVenuePolicyChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    VenuePolicy change = 2;
    StreamVenuePolicyChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamVenuePolicyChanges`.
message StreamVenuePolicyChangesResponse {
  VenuePolicy venue_policy = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ResolveVenuePolicyConflict`.
message ResolveVenuePolicyConflictRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  VenuePolicy venue_policy = 3;
  ResolveVenuePolicyConflictRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ResolveVenuePolicyConflict`.
message ResolveVenuePolicyConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenuePolicy venue_policy = 1;
  ResolveVenuePolicyConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListVenuePolicyConflicts`.
message ListVenuePolicyConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenuePolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVenuePolicyConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVenuePolicyConflicts`.
message ListVenuePolicyConflictsResponse {
  repeated VenuePolicy venue_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
