syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/venues/v1/venues.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenueSectionValidationServiceProto";
option java_package = "com.acme.venues.v1";

// Checks venue sections against the rules before anything acts on them.
service VenueSectionValidationService {
  // Validates a venue section.
  rpc ValidateVenueSection(ValidateVenueSectionRequest) returns (ValidateVenueSectionResponse);

  // Previews a venue section.
  rpc PreviewVenueSection(PreviewVenueSectionRequest) returns (PreviewVenueSectionResponse);

  // Checks a venue section.
  rpc CheckVenueSectionEligibility(CheckVenueSectionEligibilityRequest) returns (CheckVenueSectionEligibilityResponse);

  // Normalizes a venue section.
  rpc NormalizeVenueSection(NormalizeVenueSectionRequest) returns (NormalizeVenueSectionResponse);

  // Explains a venue section.
  rpc ExplainVenueSectionDecision(ExplainVenueSectionDecisionRequest) returns (ExplainVenueSectionDecisionResponse);

  // Scores a venue section.
  rpc ScoreVenueSection(ScoreVenueSectionRequest) returns (ScoreVenueSectionResponse);

  // Lints a venue section.
  rpc LintVenueSections(LintVenueSectionsRequest) returns (LintVenueSectionsResponse);

  // Returns a venue section.
  rpc GetVenueSectionRules(GetVenueSectionRulesRequest) returns (GetVenueSectionRulesResponse);
}

// The request of `ValidateVenueSection`.
message ValidateVenueSectionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_section_id = 2;
  VenueSection venue_section = 3;
  ValidateVenueSectionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateVenueSection`.
message ValidateVenueSectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenueSection venue_section = 1;
  ValidateVenueSectionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

