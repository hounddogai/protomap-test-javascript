// The request of `ScoreVenueSection`.
message ScoreVenueSectionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_section_id = 2;
  VenueSection venue_section = 3;
  ScoreVenueSectionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreVenueSection`.
message ScoreVenueSectionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreVenueSectionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  VenueSection venue_section = 1;
  ScoreVenueSectionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

