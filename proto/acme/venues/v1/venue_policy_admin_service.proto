  VenuePolicy venue_policy = 1;
  RestoreVenuePolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PurgeVenuePolicy`.
message PurgeVenuePolicyRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeVenuePolicy`.
message PurgeVenuePolicyResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignVenuePolicy`.
message ReassignVenuePolicyRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
