syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/venues/v1/venues.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenueAdminServiceProto";
option java_package = "com.acme.venues.v1";

// Operator actions on venues that support staff run by hand.
service VenueAdminService {
  // Archives a venue.
  rpc ArchiveVenue(ArchiveVenueRequest) returns (ArchiveVenueResponse);

  // Restores a venue.
  rpc RestoreVenue(RestoreVenueRequest) returns (RestoreVenueResponse);

  // Reassigns a venue.
  rpc ReassignVenue(ReassignVenueRequest) returns (ReassignVenueResponse);

  // Locks a venue.
  rpc LockVenue(LockVenueRequest) returns (LockVenueResponse);

  // Unlocks a venue.
  rpc UnlockVenue(UnlockVenueRequest) returns (UnlockVenueResponse);

  // Transfers a venue.
  rpc TransferVenue(TransferVenueRequest) returns (TransferVenueResponse);

  // Repairs a venue.
  rpc RepairVenue(RepairVenueRequest) returns (RepairVenueResponse);

  // Returns a venue.
  rpc InspectVenue(InspectVenueRequest) returns (InspectVenueResponse);
}

// The request of `ArchiveVenue`.
message ArchiveVenueRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  ArchiveVenueRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveVenue`.
message ArchiveVenueResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  ArchiveVenueResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

