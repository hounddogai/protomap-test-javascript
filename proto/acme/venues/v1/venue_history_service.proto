syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/venues/v1/venues.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenueHistoryServiceProto";
option java_package = "com.acme.venues.v1";

// Keeps every version of a venue and restores earlier ones.
service VenueHistoryService {
  // Records a venue.
  rpc RecordVenueVersion(RecordVenueVersionRequest) returns (RecordVenueVersionResponse);

  // Lists venues a page at a time.
  rpc ListVenueVersions(ListVenueVersionsRequest) returns (ListVenueVersionsResponse);

  // Returns a venue.
  rpc GetVenueVersion(GetVenueVersionRequest) returns (GetVenueVersionResponse);

  // Compares a venue.
  rpc CompareVenueVersions(CompareVenueVersionsRequest) returns (CompareVenueVersionsResponse);

  // Reverts a venue.
  rpc RevertVenue(RevertVenueRequest) returns (RevertVenueResponse);

  // Annotates a venue.
  rpc AnnotateVenueVersion(AnnotateVenueVersionRequest) returns (AnnotateVenueVersionResponse);
}

// The request of `RecordVenueVersion`.
message RecordVenueVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  RecordVenueVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordVenueVersion`.
message RecordVenueVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  RecordVenueVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListVenueVersions`.
message ListVenueVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVenueVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVenueVersions`.
message ListVenueVersionsResponse {
  repeated Venue venues = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetVenueVersion`.
message GetVenueVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetVenueVersion`.
message GetVenueVersionResponse {
  Venue venue = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareVenueVersions`.
message CompareVenueVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  CompareVenueVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareVenueVersions`.
message CompareVenueVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  CompareVenueVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RevertVenue`.
message RevertVenueRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  RevertVenueRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RevertVenue`.
message RevertVenueResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  RevertVenueResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateVenueVersion`.
message AnnotateVenueVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  AnnotateVenueVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AnnotateVenueVersion`.
message AnnotateVenueVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  AnnotateVenueVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
