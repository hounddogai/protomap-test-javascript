syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/venues/v1/venues.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenueSectionExportServiceProto";
option java_package = "com.acme.venues.v1";

// Exports venue sections to files and other systems.
service VenueSectionExportService {
  // Streams every matching venue section.
  rpc StreamVenueSectionExport(StreamVenueSectionExportRequest) returns (stream StreamVenueSectionExportResponse);

  // Returns a venue section.
  rpc GetVenueSectionExport(GetVenueSectionExportRequest) returns (GetVenueSectionExportResponse);

  // Cancels a venue section.
  rpc CancelVenueSectionExport(CancelVenueSectionExportRequest) returns (CancelVenueSectionExportResponse);

  // Lists venue sections a page at a time.
  rpc ListVenueSectionExports(ListVenueSectionExportsRequest) returns (ListVenueSectionExportsResponse);

  // Schedules a venue section.
  rpc ScheduleVenueSectionExport(ScheduleVenueSectionExportRequest) returns (ScheduleVenueSectionExportResponse);

  // Shares a venue section.
  rpc ShareVenueSectionExport(ShareVenueSectionExportRequest) returns (ShareVenueSectionExportResponse);
}

// The request of `StreamVenueSectionExport`.
message StreamVenueSectionExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueSectionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamVenueSectionExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamVenueSectionExport`.
message StreamVenueSectionExportResponse {
  VenueSection venue_section = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetVenueSectionExport`.
message GetVenueSectionExportRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_section_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetVenueSectionExport`.
message GetVenueSectionExportResponse {
  VenueSection venue_section = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelVenueSectionExport`.
message CancelVenueSectionExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_section_id = 2;
  CancelVenueSectionExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelVenueSectionExport`.
message CancelVenueSectionExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenueSection venue_section = 1;
  CancelVenueSectionExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListVenueSectionExports`.
message ListVenueSectionExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueSectionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVenueSectionExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVenueSectionExports`.
message ListVenueSectionExportsResponse {
  repeated VenueSection venue_sections = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleVenueSectionExport`.
message ScheduleVenueSectionExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_section_id = 2;
  ScheduleVenueSectionExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleVenueSectionExport`.
message ScheduleVenueSectionExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareVenueSectionExport`.
message ShareVenueSectionExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_section_id = 2;
  ShareVenueSectionExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareVenueSectionExport`.
message ShareVenueSectionExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenueSection venue_section = 1;
  ShareVenueSectionExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
