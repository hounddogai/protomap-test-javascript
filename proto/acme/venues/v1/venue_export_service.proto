syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/venues/v1/venues.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenueExportServiceProto";
option java_package = "com.acme.venues.v1";

// Exports venues to files and other systems.
service VenueExportService {
  // Streams every matching venue.
  rpc StreamVenueExport(StreamVenueExportRequest) returns (stream StreamVenueExportResponse);

  // Returns a venue.
  rpc GetVenueExport(GetVenueExportRequest) returns (GetVenueExportResponse);

  // Cancels a venue.
  rpc CancelVenueExport(CancelVenueExportRequest) returns (CancelVenueExportResponse);

  // Lists venues a page at a time.
  rpc ListVenueExports(ListVenueExportsRequest) returns (ListVenueExportsResponse);

  // Schedules a venue.
  rpc ScheduleVenueExport(ScheduleVenueExportRequest) returns (ScheduleVenueExportResponse);

  // Retrys a venue.
  rpc RetryVenueExport(RetryVenueExportRequest) returns (RetryVenueExportResponse);
}

// The request of `StreamVenueExport`.
message StreamVenueExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamVenueExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamVenueExport`.
message StreamVenueExportResponse {
  Venue venue = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetVenueExport`.
message GetVenueExportRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetVenueExport`.
message GetVenueExportResponse {
  Venue venue = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelVenueExport`.
message CancelVenueExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  CancelVenueExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelVenueExport`.
message CancelVenueExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  CancelVenueExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListVenueExports`.
message ListVenueExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVenueExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVenueExports`.
message ListVenueExportsResponse {
  repeated Venue venues = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleVenueExport`.
message ScheduleVenueExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  ScheduleVenueExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleVenueExport`.
message ScheduleVenueExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryVenueExport`.
message RetryVenueExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  RetryVenueExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryVenueExport`.
message RetryVenueExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  RetryVenueExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
