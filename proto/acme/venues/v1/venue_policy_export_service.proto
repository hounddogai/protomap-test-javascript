syntax = "proto3";

package acme.venues.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/venues/v1/venues.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Venues.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/venues/v1;venuesv1";
option java_multiple_files = true;
option java_outer_classname = "VenuePolicyExportServiceProto";
option java_package = "com.acme.venues.v1";

// Exports venue policies to files and other systems.
service VenuePolicyExportService {
  // Streams every matching venue policy.
  rpc StreamVenuePolicyExport(StreamVenuePolicyExportRequest) returns (stream StreamVenuePolicyExportResponse);

  // Returns a venue policy.
  rpc GetVenuePolicyExport(GetVenuePolicyExportRequest) returns (GetVenuePolicyExportResponse);

  // Cancels a venue policy.
  rpc CancelVenuePolicyExport(CancelVenuePolicyExportRequest) returns (CancelVenuePolicyExportResponse);

  // Lists venue policies a page at a time.
  rpc ListVenuePolicyExports(ListVenuePolicyExportsRequest) returns (ListVenuePolicyExportsResponse);

  // Schedules a venue policy.
  rpc ScheduleVenuePolicyExport(ScheduleVenuePolicyExportRequest) returns (ScheduleVenuePolicyExportResponse);

  // Retrys a venue policy.
  rpc RetryVenuePolicyExport(RetryVenuePolicyExportRequest) returns (RetryVenuePolicyExportResponse);

  // Shares a venue policy.
  rpc ShareVenuePolicyExport(ShareVenuePolicyExportRequest) returns (ShareVenuePolicyExportResponse);
}

// The request of `StreamVenuePolicyExport`.
message StreamVenuePolicyExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenuePolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamVenuePolicyExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamVenuePolicyExport`.
message StreamVenuePolicyExportResponse {
  VenuePolicy venue_policy = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetVenuePolicyExport`.
message GetVenuePolicyExportRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetVenuePolicyExport`.
message GetVenuePolicyExportResponse {
  VenuePolicy venue_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelVenuePolicyExport`.
message CancelVenuePolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  CancelVenuePolicyExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelVenuePolicyExport`.
message CancelVenuePolicyExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenuePolicy venue_policy = 1;
  CancelVenuePolicyExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListVenuePolicyExports`.
message ListVenuePolicyExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenuePolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVenuePolicyExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVenuePolicyExports`.
message ListVenuePolicyExportsResponse {
  repeated VenuePolicy venue_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleVenuePolicyExport`.
message ScheduleVenuePolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  ScheduleVenuePolicyExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleVenuePolicyExport`.
message ScheduleVenuePolicyExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryVenuePolicyExport`.
message RetryVenuePolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  VenuePolicy venue_policy = 3;
  RetryVenuePolicyExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryVenuePolicyExport`.
message RetryVenuePolicyExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenuePolicy venue_policy = 1;
  RetryVenuePolicyExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareVenuePolicyExport`.
message ShareVenuePolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_policy_id = 2;
  ShareVenuePolicyExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareVenuePolicyExport`.
message ShareVenuePolicyExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VenuePolicy venue_policy = 1;
  ShareVenuePolicyExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
