syntax = "proto3";

package acme.broadcasts.v1;

import "acme/broadcasts/v1/broadcasts.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "StreamKeyApprovalServiceProto";
option java_package = "com.acme.broadcasts.v1";

// Routes stream keys through approval, with escalation and delegation.
service StreamKeyApprovalService {
  // Submits a stream key.
  rpc SubmitStreamKey(SubmitStreamKeyRequest) returns (SubmitStreamKeyResponse);

  // Approves a stream key.
  rpc ApproveStreamKey(ApproveStreamKeyRequest) returns (ApproveStreamKeyResponse);

  // Escalates a stream key.
  rpc EscalateStreamKey(EscalateStreamKeyRequest) returns (EscalateStreamKeyResponse);

  // Lists stream keys a page at a time.
  rpc ListPendingStreamKeys(ListPendingStreamKeysRequest) returns (ListPendingStreamKeysResponse);

  // Delegates a stream key.
  rpc DelegateStreamKeyApproval(DelegateStreamKeyApprovalRequest) returns (DelegateStreamKeyApprovalResponse);

  // Recalls a stream key.
  rpc RecallStreamKey(RecallStreamKeyRequest) returns (RecallStreamKeyResponse);

  // Comments a stream key.
  rpc CommentStreamKeyApproval(CommentStreamKeyApprovalRequest) returns (CommentStreamKeyApprovalResponse);
}

// The request of `SubmitStreamKey`.
message SubmitStreamKeyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string stream_key_id = 2;
  StreamKey stream_key = 3;
  SubmitStreamKeyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitStreamKey`.
message SubmitStreamKeyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StreamKey stream_key = 1;
  SubmitStreamKeyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

