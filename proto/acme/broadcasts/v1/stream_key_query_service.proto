syntax = "proto3";

package acme.broadcasts.v1;

import "acme/broadcasts/v1/broadcasts.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "StreamKeyQueryServiceProto";
option java_package = "com.acme.broadcasts.v1";

// Answers read-only questions about stream keys, for screens and reports.
service StreamKeyQueryService {
  // Returns a stream key.
  rpc LookupStreamKey(LookupStreamKeyRequest) returns (LookupStreamKeyResponse);

  // Lists stream keys a page at a time.
  rpc BrowseStreamKeys(BrowseStreamKeysRequest) returns (BrowseStreamKeysResponse);

  // Lists stream keys a page at a time.
  rpc FindStreamKeys(FindStreamKeysRequest) returns (FindStreamKeysResponse);

  // Returns several stream keys at once.
  rpc ResolveStreamKeys(ResolveStreamKeysRequest) returns (ResolveStreamKeysResponse);

  // Streams every matching stream key.
  rpc ExportStreamKeys(ExportStreamKeysRequest) returns (stream ExportStreamKeysResponse);

  // Summarizes a stream key.
  rpc SummarizeStreamKeys(SummarizeStreamKeysRequest) returns (SummarizeStreamKeysResponse);

  // Lists stream keys a page at a time.
  rpc SuggestStreamKeys(SuggestStreamKeysRequest) returns (SuggestStreamKeysResponse);

  // Returns a stream key.
  rpc PeekStreamKey(PeekStreamKeyRequest) returns (PeekStreamKeyResponse);
}

// The request of `LookupStreamKey`.
message LookupStreamKeyRequest {
  acme.common.v1.RequestContext context = 1;
  string stream_key_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupStreamKey`.
message LookupStreamKeyResponse {
  StreamKey stream_key = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseStreamKeys`.
message BrowseStreamKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StreamKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseStreamKeysRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseStreamKeys`.
message BrowseStreamKeysResponse {
  repeated StreamKey stream_keys = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindStreamKeys`.
message FindStreamKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StreamKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindStreamKeysRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindStreamKeys`.
message FindStreamKeysResponse {
  repeated StreamKey stream_keys = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveStreamKeys`.
message ResolveStreamKeysRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string stream_key_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveStreamKeys`.
message ResolveStreamKeysResponse {
  repeated StreamKey stream_keys = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportStreamKeys`.
message ExportStreamKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StreamKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportStreamKeysRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportStreamKeys`.
message ExportStreamKeysResponse {
  StreamKey stream_key = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeStreamKeys`.
message SummarizeStreamKeysRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string stream_key_id = 2;
  SummarizeStreamKeysRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeStreamKeys`.
message SummarizeStreamKeysResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestStreamKeys`.
message SuggestStreamKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated StreamKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestStreamKeysRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestStreamKeys`.
message SuggestStreamKeysResponse {
  repeated StreamKey stream_keys = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekStreamKey`.
message PeekStreamKeyRequest {
  acme.common.v1.RequestContext context = 1;
  string stream_key_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekStreamKey`.
message PeekStreamKeyResponse {
  StreamKey stream_key = 1;
  acme.common.v1.OperationResult result = 2;
}
