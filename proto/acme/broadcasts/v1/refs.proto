syntax = "proto3";

package acme.broadcasts.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.broadcasts.v1";

// A reference to a broadcast of the broadcasts domain.
message BroadcastRef {
  string broadcast_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a stream key of the broadcasts domain.
message StreamKeyRef {
  string stream_key_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a replay clip of the broadcasts domain.
message ReplayClipRef {
  string replay_clip_id = 1;
  string display_name = 2;
  string code = 3;
}
