option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "StreamKeyWorkflowServiceProto";
option java_package = "com.acme.broadcasts.v1";

// Runs the long-lived workflow that takes a stream key from start to finish.
service StreamKeyWorkflowService {
  // Starts a stream key.
  rpc StartStreamKeyWorkflow(StartStreamKeyWorkflowRequest) returns (StartStreamKeyWorkflowResponse);

  // Advances a stream key.
  rpc AdvanceStreamKeyWorkflow(AdvanceStreamKeyWorkflowRequest) returns (AdvanceStreamKeyWorkflowResponse);

  // Cancels a stream key.
  rpc CancelStreamKeyWorkflow(CancelStreamKeyWorkflowRequest) returns (CancelStreamKeyWorkflowResponse);

  // Retrys a stream key.
  rpc RetryStreamKeyWorkflow(RetryStreamKeyWorkflowRequest) returns (RetryStreamKeyWorkflowResponse);

  // Pauses a stream key.
  rpc PauseStreamKeyWorkflow(PauseStreamKeyWorkflowRequest) returns (PauseStreamKeyWorkflowResponse);

  // Resumes a stream key.
  rpc ResumeStreamKeyWorkflow(ResumeStreamKeyWorkflowRequest) returns (ResumeStreamKeyWorkflowResponse);

  // Returns a stream key.
  rpc InspectStreamKeyWorkflow(InspectStreamKeyWorkflowRequest) returns (InspectStreamKeyWorkflowResponse);

  // Lists stream keys a page at a time.
  rpc ListStreamKeyWorkflows(ListStreamKeyWorkflowsRequest) returns (ListStreamKeyWorkflowsResponse);

  // Signals a stream key.
  rpc SignalStreamKeyWorkflow(SignalStreamKeyWorkflowRequest) returns (SignalStreamKeyWorkflowResponse);
}

// The request of `StartStreamKeyWorkflow`.
message StartStreamKeyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string stream_key_id = 2;
  StreamKey stream_key = 3;
  StartStreamKeyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartStreamKeyWorkflow`.
message StartStreamKeyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StreamKey stream_key = 1;
  StartStreamKeyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

