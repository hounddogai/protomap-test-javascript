import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "BroadcastWorkflowServiceProto";
option java_package = "com.acme.broadcasts.v1";

// Runs the long-lived workflow that takes a broadcast from start to finish.
service BroadcastWorkflowService {
  // Starts a broadcast.
  rpc StartBroadcastWorkflow(StartBroadcastWorkflowRequest) returns (StartBroadcastWorkflowResponse);

  // Advances a broadcast.
  rpc AdvanceBroadcastWorkflow(AdvanceBroadcastWorkflowRequest) returns (AdvanceBroadcastWorkflowResponse);

  // Cancels a broadcast.
  rpc CancelBroadcastWorkflow(CancelBroadcastWorkflowRequest) returns (CancelBroadcastWorkflowResponse);

  // Pauses a broadcast.
  rpc PauseBroadcastWorkflow(PauseBroadcastWorkflowRequest) returns (PauseBroadcastWorkflowResponse);

  // Resumes a broadcast.
  rpc ResumeBroadcastWorkflow(ResumeBroadcastWorkflowRequest) returns (ResumeBroadcastWorkflowResponse);

  // Returns a broadcast.
  rpc InspectBroadcastWorkflow(InspectBroadcastWorkflowRequest) returns (InspectBroadcastWorkflowResponse);

  // Signals a broadcast.
  rpc SignalBroadcastWorkflow(SignalBroadcastWorkflowRequest) returns (SignalBroadcastWorkflowResponse);
}

// The request of `StartBroadcastWorkflow`.
message StartBroadcastWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string broadcast_id = 2;
  Broadcast broadcast = 3;
  StartBroadcastWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartBroadcastWorkflow`.
message StartBroadcastWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Broadcast broadcast = 1;
  StartBroadcastWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

