syntax = "proto3";

package acme.broadcasts.v1;

import "acme/broadcasts/v1/broadcasts.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "ReplayClipCalculationServiceProto";
option java_package = "com.acme.broadcasts.v1";

// Computes the figures of a replay clip, such as totals, taxes, and estimates.
service ReplayClipCalculationService {
  // Calculates a replay clip.
  rpc CalculateReplayClip(CalculateReplayClipRequest) returns (CalculateReplayClipResponse);

  // Estimates a replay clip.
  rpc EstimateReplayClip(EstimateReplayClipRequest) returns (EstimateReplayClipResponse);

  // Quotes a replay clip.
  rpc QuoteReplayClip(QuoteReplayClipRequest) returns (QuoteReplayClipResponse);

  // Compares a replay clip.
  rpc CompareReplayClipOptions(CompareReplayClipOptionsRequest) returns (CompareReplayClipOptionsResponse);

  // Recalculates a replay clip.
  rpc RecalculateReplayClips(RecalculateReplayClipsRequest) returns (RecalculateReplayClipsResponse);

  // Simulates a replay clip.
  rpc SimulateReplayClip(SimulateReplayClipRequest) returns (SimulateReplayClipResponse);

  // Explains a replay clip.
  rpc ExplainReplayClipCalculation(ExplainReplayClipCalculationRequest) returns (ExplainReplayClipCalculationResponse);
}

// The request of `CalculateReplayClip`.
message CalculateReplayClipRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string replay_clip_id = 2;
  ReplayClip replay_clip = 3;
  CalculateReplayClipRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateReplayClip`.
message CalculateReplayClipResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateReplayClipResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ReplayClip replay_clip = 1;
  CalculateReplayClipResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

