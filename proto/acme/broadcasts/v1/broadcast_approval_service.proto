syntax = "proto3";

package acme.broadcasts.v1;

import "acme/broadcasts/v1/broadcasts.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "BroadcastApprovalServiceProto";
option java_package = "com.acme.broadcasts.v1";

// Routes broadcasts through approval, with escalation and delegation.
service BroadcastApprovalService {
  // Submits a broadcast.
  rpc SubmitBroadcast(SubmitBroadcastRequest) returns (SubmitBroadcastResponse);

  // Approves a broadcast.
  rpc ApproveBroadcast(ApproveBroadcastRequest) returns (ApproveBroadcastResponse);

  // Rejects a broadcast.
  rpc RejectBroadcast(RejectBroadcastRequest) returns (RejectBroadcastResponse);

  // Escalates a broadcast.
  rpc EscalateBroadcast(EscalateBroadcastRequest) returns (EscalateBroadcastResponse);

  // Lists broadcasts a page at a time.
  rpc ListPendingBroadcasts(ListPendingBroadcastsRequest) returns (ListPendingBroadcastsResponse);

  // Delegates a broadcast.
  rpc DelegateBroadcastApproval(DelegateBroadcastApprovalRequest) returns (DelegateBroadcastApprovalResponse);

  // Returns a broadcast.
  rpc GetBroadcastApprovalStatus(GetBroadcastApprovalStatusRequest) returns (GetBroadcastApprovalStatusResponse);

  // Comments a broadcast.
  rpc CommentBroadcastApproval(CommentBroadcastApprovalRequest) returns (CommentBroadcastApprovalResponse);
}

// The request of `SubmitBroadcast`.
message SubmitBroadcastRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string broadcast_id = 2;
  Broadcast broadcast = 3;
  SubmitBroadcastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBroadcast`.
message SubmitBroadcastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Broadcast broadcast = 1;
  SubmitBroadcastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

