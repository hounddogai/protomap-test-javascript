syntax = "proto3";

package acme.broadcasts.v1;

import "acme/broadcasts/v1/broadcasts.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "ReplayClipWorkflowServiceProto";
option java_package = "com.acme.broadcasts.v1";

// Runs the long-lived workflow that takes a replay clip from start to finish.
service ReplayClipWorkflowService {
  // Starts a replay clip.
  rpc StartReplayClipWorkflow(StartReplayClipWorkflowRequest) returns (StartReplayClipWorkflowResponse);

  // Advances a replay clip.
  rpc AdvanceReplayClipWorkflow(AdvanceReplayClipWorkflowRequest) returns (AdvanceReplayClipWorkflowResponse);

  // Cancels a replay clip.
  rpc CancelReplayClipWorkflow(CancelReplayClipWorkflowRequest) returns (CancelReplayClipWorkflowResponse);

  // Pauses a replay clip.
  rpc PauseReplayClipWorkflow(PauseReplayClipWorkflowRequest) returns (PauseReplayClipWorkflowResponse);

  // Resumes a replay clip.
  rpc ResumeReplayClipWorkflow(ResumeReplayClipWorkflowRequest) returns (ResumeReplayClipWorkflowResponse);

  // Returns a replay clip.
  rpc InspectReplayClipWorkflow(InspectReplayClipWorkflowRequest) returns (InspectReplayClipWorkflowResponse);

  // Lists replay clips a page at a time.
  rpc ListReplayClipWorkflows(ListReplayClipWorkflowsRequest) returns (ListReplayClipWorkflowsResponse);
}

// The request of `StartReplayClipWorkflow`.
message StartReplayClipWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string replay_clip_id = 2;
  ReplayClip replay_clip = 3;
  StartReplayClipWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartReplayClipWorkflow`.
message StartReplayClipWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ReplayClip replay_clip = 1;
  StartReplayClipWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

