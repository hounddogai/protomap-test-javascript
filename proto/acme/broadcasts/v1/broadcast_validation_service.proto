syntax = "proto3";

package acme.broadcasts.v1;

import "acme/broadcasts/v1/broadcasts.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Broadcasts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/broadcasts/v1;broadcastsv1";
option java_multiple_files = true;
option java_outer_classname = "BroadcastValidationServiceProto";
option java_package = "com.acme.broadcasts.v1";

// Checks broadcasts against the rules before anything acts on them.
service BroadcastValidationService {
  // Validates a broadcast.
  rpc ValidateBroadcast(ValidateBroadcastRequest) returns (ValidateBroadcastResponse);

  // Previews a broadcast.
  rpc PreviewBroadcast(PreviewBroadcastRequest) returns (PreviewBroadcastResponse);

  // Checks a broadcast.
  rpc CheckBroadcastEligibility(CheckBroadcastEligibilityRequest) returns (CheckBroadcastEligibilityResponse);

  // Normalizes a broadcast.
  rpc NormalizeBroadcast(NormalizeBroadcastRequest) returns (NormalizeBroadcastResponse);

  // Explains a broadcast.
  rpc ExplainBroadcastDecision(ExplainBroadcastDecisionRequest) returns (ExplainBroadcastDecisionResponse);

  // Scores a broadcast.
  rpc ScoreBroadcast(ScoreBroadcastRequest) returns (ScoreBroadcastResponse);

  // Lints a broadcast.
  rpc LintBroadcasts(LintBroadcastsRequest) returns (LintBroadcastsResponse);

  // Returns a broadcast.
  rpc GetBroadcastRules(GetBroadcastRulesRequest) returns (GetBroadcastRulesResponse);
}

// The request of `ValidateBroadcast`.
message ValidateBroadcastRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string broadcast_id = 2;
  Broadcast broadcast = 3;
  ValidateBroadcastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateBroadcast`.
message ValidateBroadcastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Broadcast broadcast = 1;
  ValidateBroadcastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

